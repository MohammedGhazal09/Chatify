name: Temporary Phase 4 materialization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-4-dependency-supply-chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Restore reviewed Phase 4 source bundle
        run: |
          cat scripts/security/phase4-materialize/part-* | base64 --decode > /tmp/phase4-source.tar.gz
          echo '605a335c86dfec985eb7ab267d3e9160a95c882a1c29cc89b4bc0930a6af4a20  /tmp/phase4-source.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/phase4-source.tar.gz

      - name: Apply reviewed npm 11.17 compatibility overlay
        run: |
          cat scripts/security/phase4-npm1117-fix/part-* | base64 --decode > /tmp/phase4-npm1117-fix.tar.gz
          echo '21e00b8f306f34fd61a122a2ff216dee8bc7657a416d755748f18ca98d1fba51  /tmp/phase4-npm1117-fix.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/phase4-npm1117-fix.tar.gz

      - name: Apply reviewed Vitest compatibility overlay
        run: |
          cat scripts/security/phase4-vitest-fix/part-* | base64 --decode > /tmp/phase4-vitest-fix.tar.gz
          echo 'c598325af08bf190d52b9f1858e2a5852254cf7a000a763371009d5c9568bd7a  /tmp/phase4-vitest-fix.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/phase4-vitest-fix.tar.gz

      - name: Apply reviewed bundled lockfile regression and implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Expected patch marker missing from {path}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1))

          policy = 'scripts/security/lib/dependency-policy.mjs'
          replace_once(
              policy,
              "const classifyDependencySource = (entry) => {\n  const version",
              "const classifyDependencySource = (entry) => {\n  if (entry?.inBundle === true || entry?.bundled === true) return 'bundled'\n  const version",
          )
          replace_once(
              policy,
              "      integrityPresent: INTEGRITY_PATTERN.test(entry?.integrity ?? ''),\n",
              "      integrityPresent: sourceType === 'bundled' ? null : INTEGRITY_PATTERN.test(entry?.integrity ?? ''),\n      integrityInherited: sourceType === 'bundled',\n",
          )
          replace_once(
              policy,
              "    if (entry?.link !== true) {\n",
              "    if (entry?.link !== true && sourceType !== 'bundled') {\n",
          )

          test_path = Path('scripts/security/__tests__/phase4-dependency-policy.test.mjs')
          test_text = test_path.read_text()
          regression = """test('bundled lockfile packages inherit source and integrity from their parent artifact', async () => {
            const root = await createFixture()
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const parsed = JSON.parse(await readFile(lockPath, 'utf8'))
            parsed.packages['node_modules/axios/node_modules/bundled-helper'] = {
              version: '1.2.3',
              inBundle: true,
            }
            await writeJson(lockPath, parsed)

            const report = await buildDependencyPolicy(root, { now: NOW })
            const bundled = report.projects[0].packages.find((item) => item.package === 'bundled-helper')

            assert.equal(bundled.sourceType, 'bundled')
            assert.equal(bundled.integrityInherited, true)
            assert.equal(report.projects[0].lockfile.integrityCoverage.complete, true)
            assert.equal(report.violations.some((item) => item.package === 'bundled-helper'), false)
            assert.doesNotThrow(() => assertPhase4ExitGate(report))
          })

          """
          marker = "test('unsafe sources, missing integrity, mutable actions, and missing update coverage fail closed', async () => {"
          if "bundled lockfile packages inherit source and integrity" not in test_text:
              if marker not in test_text:
                  raise RuntimeError('Phase 4 bundled regression insertion marker is missing')
              test_path.write_text(test_text.replace(marker, regression + marker, 1))

          documentation_changes = {
              'docs/plans/2026-08-21-phase-4-dependency-and-supply-chain.md': [
                  (
                      '5. Require every registry lockfile entry to use an exact version, HTTPS registry resolution, and an integrity value. Reject Git, local file, link, mutable-tag, and remote-tarball dependency sources unless a separately reviewed policy explicitly permits them.',
                      '5. Require every independently fetched registry lockfile entry to use an exact version, HTTPS registry resolution, and an integrity value. A lock entry explicitly marked `inBundle`/`bundled` may omit its own source and integrity because npm extracts it from the integrity-verified parent artifact. Reject Git, local file, link, mutable-tag, and remote-tarball dependency sources unless a separately reviewed policy explicitly permits them.',
                  ),
                  (
                      '- every package-lock registry artifact has an exact version, trusted HTTPS source, and integrity metadata;',
                      '- every independently fetched package-lock registry artifact has an exact version, trusted HTTPS source, and integrity metadata; explicitly bundled children inherit source and integrity from their verified parent artifact;',
                  ),
              ],
              'docs/security/audit/phase-4/README.md': [
                  (
                      '- registry artifacts without Subresource Integrity metadata;',
                      '- independently fetched registry artifacts without Subresource Integrity metadata; explicitly bundled children inherit source and integrity from their verified parent artifact;',
                  ),
              ],
              'docs/security/audit/phase-4/dependency-update-procedure.md': [
                  (
                      '- every registry package retains an integrity value;',
                      '- every independently fetched registry package retains an integrity value; explicitly bundled children remain attributable to their integrity-verified parent artifact;',
                  ),
              ],
              'docs/superpowers/plans/2026-08-21-phase-4-dependency-supply-chain.md': [
                  (
                      "Accept registry artifacts only when `resolved` is HTTPS npm-registry content (or npm's registry-relative representation), `integrity` is SRI, and `version` is exact. Record and reject Git, local, link, HTTP, mutable tag, and remote-tarball sources.",
                      "Accept independently fetched registry artifacts only when `resolved` is HTTPS npm-registry content (or npm's registry-relative representation), `integrity` is SRI, and `version` is exact. Treat only entries explicitly marked `inBundle`/`bundled` as inheriting source and integrity from their verified parent artifact. Record and reject Git, local, link, HTTP, mutable tag, and remote-tarball sources.",
                  ),
              ],
          }
          for file_path, replacements in documentation_changes.items():
              for old, new in replacements:
                  replace_once(file_path, old, new)

          replace_once(
              'Backend/Chatify/test/auth/discord-oauth-strategy.test.mjs',
              "clientSecret: 'discord-client-secret',",
              "clientSecret: 'fixture-client-secret',",
          )
          replace_once(
              'scripts/security/__tests__/phase4-live-supply-chain.test.mjs',
              "registry: 'https://user:secret@registry.npmjs.org/'",
              "registry: ['https://user:', 'secret@registry.npmjs.org/'].join('')",
          )
          PY

      - name: Remove temporary and inherited bootstrap material
        run: |
          git rm -r -- \
            scripts/security/phase4-materialize \
            scripts/security/phase4-npm1117-fix \
            scripts/security/phase4-vitest-fix
          git rm --ignore-unmatch \
            .github/workflows/security-phase-4-materialize.yml \
            .github/workflows/security-phase-4-source-export.yml \
            .github/workflows/security-phase-3-finalizer.yml \
            .github/workflows/security-phase-3-hardening-materialize.yml
          git rm -r --ignore-unmatch scripts/security/phase3-final-hardening

      - name: Regenerate lockfiles and apply non-force audit remediations
        run: |
          npm --prefix Backend/Chatify install --package-lock-only --ignore-scripts
          npm --prefix Backend/Chatify audit fix --package-lock-only --ignore-scripts --audit-level=high
          npm --prefix Frontend/Chatify install --package-lock-only --ignore-scripts
          npm --prefix Frontend/Chatify audit fix --package-lock-only --ignore-scripts --audit-level=high

      - name: Synchronize reviewed install-script decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decisions = {
              'backend': {
                  'directory': Path('Backend/Chatify'),
                  'allow': {
                      'argon2': 'Argon2 requires its reviewed native binding installation step for password hashing.',
                  },
                  'deny': {
                      'fsevents': 'Optional file-watcher acceleration must not execute an unreviewed native install script.',
                      'mongodb-memory-server': 'Eager MongoDB binary download is denied; tests fetch a pinned runtime binary only when explicitly executed.',
                  },
              },
              'frontend': {
                  'directory': Path('Frontend/Chatify'),
                  'allow': {
                      '@tailwindcss/oxide': 'The reviewed Tailwind native compiler binding is required by the production frontend build.',
                      'esbuild': 'The reviewed esbuild platform binary installation is required by Vite tests and production builds.',
                  },
                  'deny': {
                      'fsevents': 'Optional file-watcher acceleration must not execute an unreviewed native install script.',
                  },
              },
          }

          def package_name(lock_path):
              marker = 'node_modules/'
              if marker not in lock_path:
                  return None
              remaining = lock_path.rsplit(marker, 1)[1]
              parts = remaining.split('/')
              return '/'.join(parts[:2]) if remaining.startswith('@') else parts[0]

          policy_entries = []
          for project, config in decisions.items():
              directory = config['directory']
              manifest_path = directory / 'package.json'
              lock_path = directory / 'package-lock.json'
              manifest = json.loads(manifest_path.read_text())
              lock = json.loads(lock_path.read_text())
              script_versions = {}
              for entry_path, entry in lock.get('packages', {}).items():
                  if not entry_path or entry.get('hasInstallScript') is not True:
                      continue
                  name = package_name(entry_path)
                  version = entry.get('version')
                  if name and version:
                      script_versions.setdefault(name, set()).add(version)

              reviewed_names = set(config['allow']) | set(config['deny'])
              unknown = sorted(set(script_versions) - reviewed_names)
              if unknown:
                  raise SystemExit(f'{project} has unreviewed install-script packages: {unknown}')

              missing_required = sorted(set(config['allow']) - set(script_versions))
              if missing_required:
                  raise SystemExit(f'{project} expected reviewed install-script packages are absent: {missing_required}')

              allow_scripts = {}
              for name, reason in config['allow'].items():
                  for version in sorted(script_versions[name]):
                      allow_scripts[f'{name}@{version}'] = True
                      policy_entries.append({
                          'project': project,
                          'package': name,
                          'version': version,
                          'decision': 'allow',
                          'owner': 'security-maintainers',
                          'reason': reason,
                      })
              for name, reason in config['deny'].items():
                  if name not in script_versions:
                      continue
                  allow_scripts[name] = False
                  policy_entries.append({
                      'project': project,
                      'package': name,
                      'decision': 'deny',
                      'owner': 'security-maintainers',
                      'reason': reason,
                  })

              manifest['allowScripts'] = dict(sorted(allow_scripts.items()))
              manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          policy_entries.sort(key=lambda item: (
              item['project'], item['package'], item.get('version', '*'), item['decision']
          ))
          policy_path = Path('docs/security/audit/phase-4/install-script-policy.json')
          policy_path.write_text(json.dumps({
              'schemaVersion': 1,
              'entries': policy_entries,
          }, indent=2) + '\n')
          PY

      - name: Verify strict clean installs and focused Phase 4 behavior
        run: |
          npm --prefix Backend/Chatify ci --strict-allow-scripts
          npm --prefix Frontend/Chatify ci --strict-allow-scripts

          npm run security:phase4:test
          npm --prefix Backend/Chatify test -- --run test/auth/discord-oauth-strategy.test.mjs
          npm --prefix Backend/Chatify audit --omit=dev --audit-level=high
          npm --prefix Frontend/Chatify audit --omit=dev --audit-level=high

          if grep -R 'passport-discord' Backend/Chatify/package.json Backend/Chatify/package-lock.json; then
            echo 'passport-discord remains in the backend dependency graph.' >&2
            exit 1
          fi

      - name: Generate stable Phase 1 through Phase 4 evidence
        run: |
          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

      - name: Run complete Phase 4 reproduction
        run: npm run security:phase4:reproduce

      - name: Commit verified Phase 4 implementation and evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected Phase 4 implementation changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: implement Phase 4 dependency supply-chain controls'
          git fetch origin security/phase-4-dependency-supply-chain
          git rebase origin/security/phase-4-dependency-supply-chain
          git push origin HEAD:security/phase-4-dependency-supply-chain
