name: Phase 1 Bootstrap Repair

on:
  push:
    branches:
      - security/phase-1-repository-inventory
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-1-bootstrap-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-1-repository-inventory
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0

      - name: Apply fail-closed scanner repair
        run: node scripts/security/apply-phase1-fix.mjs

      - name: Exclude bootstrap files from generated evidence
        run: |
          git rm --cached -- \
            .github/workflows/phase1-bootstrap-repair.yml \
            scripts/security/apply-phase1-fix.mjs

      - name: Verify repaired parser
        run: |
          node --check scripts/security/lib/inventory.mjs
          npm run security:phase1:test

      - name: Regenerate and verify deterministic inventory
        run: |
          npm run security:phase1:generate
          npm run security:phase1:check

      - name: Commit repaired source and evidence
        run: |
          git reset HEAD -- \
            .github/workflows/phase1-bootstrap-repair.yml \
            scripts/security/apply-phase1-fix.mjs
          git add \
            scripts/security/lib/inventory.mjs \
            docs/security/audit/phase-1/inventory.json \
            docs/security/audit/phase-1/inventory.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected Phase 1 repair changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): complete Phase 1 inventory parsing'
          git push origin HEAD:security/phase-1-repository-inventory
