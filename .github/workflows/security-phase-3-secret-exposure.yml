name: Security Phase 3 Secret Exposure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-3-secret-exposure:
    name: Current tree, Git history, and secret loading
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all available repository refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Reproduce and validate Phase 3
        run: npm run security:phase3:reproduce

      - name: Regenerate sanitized evidence after a failed gate
        if: failure()
        continue-on-error: true
        run: npm run security:phase3:generate

      - name: Upload sanitized Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-3-secret-exposure-evidence
          path: |
            .artifacts/security/phase-3/run-evidence.json
            docs/security/audit/phase-3/secret-scan.json
            docs/security/audit/phase-3/secret-scan.md
            docs/security/audit/phase-3/secret-scan-allowlist.json
            docs/security/audit/phase-3/credential-exposure-response.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
