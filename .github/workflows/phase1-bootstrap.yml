name: Phase 1 Branch Bootstrap

on:
  push:
    branches:
      - security/phase-1-repository-inventory

permissions:
  contents: write

concurrency:
  group: phase-1-branch-bootstrap
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed Phase 1 implementation
        run: |
          cat scripts/security/phase1-bootstrap-parts/part-* > scripts/security/phase1-bootstrap-bundle.mjs
          node scripts/security/phase1-bootstrap-bundle.mjs
          rm -rf scripts/security/phase1-bootstrap-parts

      - name: Run parser tests before repository installation
        run: npm run security:phase1:test

      - name: Generate inventory from the real branch checkout
        run: npm run security:phase1:generate

      - name: Run clean reproduction and repository validation
        run: npm run security:phase1:reproduce

      - name: Preserve runtime evidence outside the commit
        run: |
          mkdir -p "${RUNNER_TEMP}/phase-1-evidence"
          cp .artifacts/security/phase-1/run-evidence.json "${RUNNER_TEMP}/phase-1-evidence/run-evidence.json"
          rm -f .artifacts/security/phase-1/run-evidence.json

      - name: Commit verified Phase 1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(security): implement phase 1 repository inventory"
          git push origin HEAD:security/phase-1-repository-inventory

      - name: Upload bootstrap verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-bootstrap-evidence
          path: |
            ${{ runner.temp }}/phase-1-evidence/run-evidence.json
            docs/security/audit/phase-1/inventory.json
            docs/security/audit/phase-1/inventory.md
          if-no-files-found: warn
          retention-days: 30
