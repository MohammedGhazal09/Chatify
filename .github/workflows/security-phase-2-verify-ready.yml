name: Temporary Phase 2 inventory finalizer

on:
  pull_request:
  push:
    branches:
      - security/phase-2-threat-model
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-inventory-finalizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-2-threat-model
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Regenerate Phase 1 evidence as if this temporary workflow is absent
        run: |
          git rm --cached -- .github/workflows/security-phase-2-verify-ready.yml
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:check
          git restore --staged -- .github/workflows/security-phase-2-verify-ready.yml

      - name: Commit regenerated evidence
        run: |
          git add docs/security/audit/phase-1/inventory.json docs/security/audit/phase-1/inventory.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Phase 1 evidence already matches the permanent Phase 2 tree.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(security): finalize Phase 2 inventory baseline'
          git push origin HEAD:security/phase-2-threat-model
