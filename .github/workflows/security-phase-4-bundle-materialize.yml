name: Temporary Phase 4 bundle materialization

on:
  push:
    branches:
      - security/phase-4-dependency-supply-chain
    paths:
      - .github/workflows/security-phase-4-bundle-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-bundle-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Download and verify Git bundle
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors \
            https://filebin.net/chatify-phase4-20260821-gpt56/chatify-phase4-final.bundle \
            --output /tmp/chatify-phase4-final.bundle
          git bundle verify /tmp/chatify-phase4-final.bundle
          git fetch /tmp/chatify-phase4-final.bundle \
            refs/heads/security/phase-4-dependency-supply-chain:refs/remotes/bundle/phase4

          bundle_sha="$(git rev-parse refs/remotes/bundle/phase4)"
          git fetch origin \
            security/phase-3-secret-exposure \
            security/phase-4-dependency-supply-chain

          git merge-base --is-ancestor \
            origin/security/phase-3-secret-exposure \
            "$bundle_sha"

          if git ls-tree -r --name-only "$bundle_sha" | grep -E \
            '^\.github/workflows/security-phase-4-(source-export|bundle-materialize)\.yml$'; then
            echo 'The reviewed bundle unexpectedly contains a temporary transfer workflow.' >&2
            exit 1
          fi

          echo "bundle_sha=$bundle_sha" >> "$GITHUB_ENV"

      - name: Check out reviewed Phase 4 commit
        run: |
          git reset --hard "$bundle_sha"
          git clean -ffd
          test "$(git rev-parse HEAD)" = "$bundle_sha"

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Reproduce Phase 4 from clean installs
        run: npm run security:phase4:reproduce

      - name: Publish reviewed branch without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          test -z "$(git status --porcelain=v1)"
          git push \
            --force-with-lease=refs/heads/security/phase-4-dependency-supply-chain:${{ github.sha }} \
            origin \
            HEAD:refs/heads/security/phase-4-dependency-supply-chain
