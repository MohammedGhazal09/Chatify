name: Temporary Phase 2 finalizer

on:
  push:
    branches:
      - security/phase-2-threat-model
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-finalizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-2-threat-model
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Normalize Phase 2 source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['packageManager'] = 'npm@11.17.0'
          package['engines'] = {'node': '24.19.0', 'npm': '11.17.0'}
          scripts = package.setdefault('scripts', {})
          scripts.update({
              'security:phase2:test': 'node --test scripts/security/__tests__/phase2-threat-model.test.mjs',
              'security:phase2:generate': 'node scripts/security/phase2-threat-model.mjs --write',
              'security:phase2:check': 'node scripts/security/phase2-threat-model.mjs --check',
              'security:phase2:reproduce': 'node scripts/security/phase2-reproduce.mjs',
          })
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          ignore_path = Path('.gitignore')
          ignore = ignore_path.read_text()
          if '.artifacts/security/' not in ignore.splitlines():
              ignore = ignore.rstrip() + '\n\n# Generated security runtime evidence\n.artifacts/security/\n'
              ignore_path.write_text(ignore)

          model_path = Path('scripts/security/lib/threat-model.mjs')
          source = model_path.read_text()
          old = "    return `${parsed.protocol}//${parsed.host}`\n"
          new = "    const redactedCredentials = parsed.username || parsed.password ? '<redacted>@' : ''\n    return `${parsed.protocol}//${redactedCredentials}${parsed.host}`\n"
          if old in source:
              source = source.replace(old, new, 1)
          model_path.write_text(source)
          PY

      - name: Verify source and regression suite
        run: |
          node --check scripts/security/lib/phase2-policy.mjs
          node --check scripts/security/lib/threat-model.mjs
          node --check scripts/security/phase2-threat-model.mjs
          node --check scripts/security/phase2-reproduce.mjs
          node --test scripts/security/__tests__/phase1-inventory.test.mjs
          node --test scripts/security/__tests__/phase2-threat-model.test.mjs

      - name: Generate deterministic Phase 2 and Phase 1 evidence
        run: |
          node scripts/security/phase2-threat-model.mjs --write
          git add -A
          node scripts/security/phase1-inventory.mjs --write
          node scripts/security/phase2-threat-model.mjs --check
          node scripts/security/phase1-inventory.mjs --check
          node scripts/security/phase1-doctor.mjs

      - name: Commit finalized source and generated evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Phase 2 source and generated evidence were already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): finalize Phase 2 threat model controls'
          git push origin HEAD:security/phase-2-threat-model
