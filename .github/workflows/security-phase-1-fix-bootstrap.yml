name: Temporary Phase 1 inventory repair

on:
  pull_request:
  push:
    branches:
      - security/phase-1-repository-inventory
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-1-repository-inventory
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Apply Phase 1 implementation correction
        run: |
          cat scripts/security/phase1-bootstrap-chunks/part-*.b64 | base64 --decode > scripts/security/phase1-fix-bootstrap.py
          nl -ba scripts/security/phase1-fix-bootstrap.py | sed -n '230,285p'
          python scripts/security/phase1-fix-bootstrap.py
          rm -rf scripts/security/phase1-bootstrap-chunks

      - name: Verify parser and generate inventory
        run: |
          node --check scripts/security/lib/inventory.mjs
          npm run security:phase1:test
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run doctor

      - name: Write GSD completion summary
        run: |
          mkdir -p .planning/quick/260820-phase-1-security-inventory
          cat > .planning/quick/260820-phase-1-security-inventory/SUMMARY.md <<'EOF'
          # Phase 1 Security Inventory — Completion Summary

          ## Implemented

          - Deterministic complete Git-tracked file hashing, excluding only self-generated inventory outputs.
          - Runtime-content isolation for documentation, planning, agent guidance, artifacts, dependencies, build output, reports, and lockfiles.
          - Express direct, mounted, and chained route discovery with generic method-call false-positive rejection.
          - Socket.IO receiver-context filtering and service-worker source isolation.
          - Environment doctor, clean reproduction evidence, generated drift enforcement, CI artifact upload, and parser regression tests.
          - Immutable action references and an exact Node runtime in the dedicated workflow.

          ## Verification

          - `node --check scripts/security/lib/inventory.mjs`
          - `npm run security:phase1:test`
          - `npm run security:phase1:generate`
          - `npm run security:phase1:check`
          - `npm run doctor`
          - The dedicated clean-reproduction workflow runs backend/frontend installation, full tests, lint, build, and operations checks.

          ## Deferred by phase boundary

          Dependency advisory remediation belongs to Phase 4. Production browser and smoke execution requires an authorized deployed topology and is explicitly recorded as not executed by Phase 1.
          EOF
          npm run security:phase1:generate
          npm run security:phase1:check

      - name: Commit corrected Phase 1 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): complete Phase 1 inventory discovery"
          git push origin HEAD:security/phase-1-repository-inventory
