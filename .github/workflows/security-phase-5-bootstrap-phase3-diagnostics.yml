name: Temporary Phase 5 Phase 3 candidate diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-phase3-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-5-authentication-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout full Phase 5 history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-5-authentication-session
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch authoritative refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/7/head:refs/remotes/pull/7/head'

      - name: Setup exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Generate sanitized Phase 3 evidence without masking the gate
        run: |
          set +e
          npm run security:phase3:generate
          status=$?
          set -e
          echo "phase3_status=$status" >> "$GITHUB_ENV"
          test -f docs/security/audit/phase-3/secret-scan.json

      - name: Print sanitized candidate metadata only
        run: |
          node <<'NODE'
          const report = require('./docs/security/audit/phase-3/secret-scan.json')
          const sanitize = (item) => ({
            candidateId: item.candidateId,
            detectorId: item.detectorId,
            severity: item.severity,
            confidence: item.confidence,
            scope: item.scope,
            filePath: item.filePath,
            line: item.line,
            column: item.column,
            suppressed: item.suppressed === true,
            occurrenceCount: item.occurrenceCount ?? null,
          })
          const output = {
            phase3Status: Number(process.env.phase3_status),
            currentTree: report.currentTree.findings.map(sanitize),
            history: report.history.findings.map(sanitize),
            summaries: {
              currentTree: report.currentTree.summary,
              history: report.history.summary,
            },
          }
          console.log(JSON.stringify(output, null, 2))
          if (
            report.currentTree.summary.unsuppressed === 0
            && report.history.summary.unsuppressed === 0
          ) process.exit(1)
          NODE

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-5-phase-3-sanitized-diagnostics
          path: |
            docs/security/audit/phase-3/secret-scan.json
            docs/security/audit/phase-3/secret-scan.md
          if-no-files-found: error
          retention-days: 7
