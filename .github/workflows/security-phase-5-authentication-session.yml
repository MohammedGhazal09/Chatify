name: Security Phase 5 Authentication and Session

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-5-authentication-session:
    name: Authentication, sessions, recovery, and OAuth
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch repository branches, tags, and current pull-request ref
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --force origin \
              '+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/${{ github.event.pull_request.number }}/head'
          fi

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Reproduce and validate Phase 5
        run: npm run security:phase5:reproduce

      - name: Regenerate deterministic policy after a failed gate
        if: failure()
        continue-on-error: true
        run: npm run security:phase5:generate

      - name: Upload sanitized Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-5-authentication-session-evidence
          path: |
            .artifacts/security/phase-5/run-evidence.json
            .artifacts/security/phase-4/backend/live-evidence.json
            .artifacts/security/phase-4/frontend/live-evidence.json
            docs/security/audit/phase-5/authentication-policy.json
            docs/security/audit/phase-5/authentication-policy.md
            docs/security/audit/phase-5/phase-5-authentication-session-spec.md
            docs/security/audit/phase-5/README.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
