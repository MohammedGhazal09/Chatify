name: Audit source export

on:
  push:
    branches:
      - audit/security-plan-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude='*.tar.gz' -czf "chatify-source-${GITHUB_SHA}.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatify-source-${{ github.sha }}
          path: chatify-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
