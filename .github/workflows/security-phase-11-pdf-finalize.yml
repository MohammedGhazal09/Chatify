name: Security Phase 11 PDF Finalize

on:
  push:
    branches:
      - security/phase-11-upload-attachments
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-11-pdf-finalize-security-phase-11-upload-attachments
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'MohammedGhazal09/Chatify'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Phase 11 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-11-upload-attachments
          fetch-depth: 0
          persist-credentials: true

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json

      - name: Verify exact branch and toolchain
        run: |
          git fetch --force origin \
            '+refs/heads/security/phase-11-upload-attachments:refs/remotes/origin/security/phase-11-upload-attachments'
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/security/phase-11-upload-attachments)"
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Normalize escaped PDF names before active-content detection
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'Backend/Chatify/Utils/uploadContentSecurity.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = `  const text = buffer.toString('latin1');
          if (ACTIVE_PDF_PATTERN.test(text)) {`;
          const after = `  const text = buffer.toString('latin1');
          const normalizedText = text.replace(/#([0-9a-f]{2})/gi, (_match, hex) => (
            String.fromCharCode(Number.parseInt(hex, 16))
          ));
          if (ACTIVE_PDF_PATTERN.test(normalizedText)) {`;
          if (!source.includes(before)) {
            throw new Error('Expected PDF validation source was not found exactly once');
          }
          if (source.indexOf(before) !== source.lastIndexOf(before)) {
            throw new Error('Expected PDF validation source was found more than once');
          }
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          node --check Backend/Chatify/Utils/uploadContentSecurity.mjs

      - name: Install controlled backend dependencies
        run: npm --prefix Backend/Chatify ci --strict-allow-scripts

      - name: Verify escaped PDF regression and adjacent upload controls
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/security/phase11-upload-security.test.mjs \
            test/security/phase11-media-type-security.test.mjs \
            test/security/phase11-office-container-security.test.mjs

      - name: Publish permanent source fix and remove finalizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/security-phase-11-pdf-finalize.yml
          git add Backend/Chatify/Utils/uploadContentSecurity.mjs
          git diff --cached --check
          git commit -m 'fix(security): decode escaped PDF action names'
          git push origin HEAD:security/phase-11-upload-attachments
