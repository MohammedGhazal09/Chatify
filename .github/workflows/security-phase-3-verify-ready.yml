name: Temporary Phase 3 focused verification

on:
  pull_request:
  push:
    branches:
      - security/phase-3-secret-exposure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-focused-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  low-entropy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix Backend/Chatify ci
      - name: Run secret-configuration regression
        run: npm --prefix Backend/Chatify test -- --run test/security/secret-configuration.test.mjs

  current-pr-ref-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Run Phase 3 regression suite
        run: npm run security:phase3:test

  sanitized-candidate-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-3-secret-exposure
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch repository history and current PR refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/4/head:refs/remotes/pull/4/head'
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Generate sanitized candidate evidence
        continue-on-error: true
        run: npm run security:phase3:generate
      - name: Upload sanitized candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-3-sanitized-candidate-diagnostic
          path: |
            docs/security/audit/phase-3/secret-scan.json
            docs/security/audit/phase-3/secret-scan.md
          if-no-files-found: error
          retention-days: 1
