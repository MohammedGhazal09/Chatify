name: Temporary Phase 4 evidence and integrity finalizer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-evidence-integrity-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-4-dependency-supply-chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Add evidence-redaction and SHA-1 regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          live_test = Path('scripts/security/__tests__/phase4-live-supply-chain.test.mjs')
          text = live_test.read_text()
          message_line = "    message: ['request to https://user:', 'password@registry.example.test/npm?token=abc#fragment failed'].join(''),\n"
          if message_line not in text:
              registry_line = "    registry: 'https://user:password@registry.example.test/npm?token=abc#fragment',\n"
              if registry_line not in text:
                  raise RuntimeError('Evidence-redaction fixture marker is missing')
              text = text.replace(registry_line, registry_line + message_line, 1)
          assertion = "  assert.equal(sanitized.message, 'request to https://registry.example.test/npm failed')\n"
          if assertion not in text:
              registry_assertion = "  assert.equal(sanitized.registry, 'https://registry.example.test/npm')\n"
              if registry_assertion not in text:
                  raise RuntimeError('Evidence-redaction assertion marker is missing')
              text = text.replace(registry_assertion, registry_assertion + assertion, 1)
          live_test.write_text(text)

          policy_test = Path('scripts/security/__tests__/phase4-dependency-policy.test.mjs')
          text = policy_test.read_text()
          regression = """test('obsolete SHA-1 lockfile integrity is rejected', async () => {
            const root = await createFixture()
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const parsed = JSON.parse(await readFile(lockPath, 'utf8'))
            parsed.packages['node_modules/axios'].integrity = 'sha1-QUJDRA=='
            await writeJson(lockPath, parsed)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'dependency-integrity-missing'
              && item.package === 'axios'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependencyIntegrityComplete/)
          })

          """
          if 'obsolete SHA-1 lockfile integrity is rejected' not in text:
              marker = "test('unsafe sources, missing integrity, mutable actions, and missing update coverage fail closed', async () => {"
              if marker not in text:
                  raise RuntimeError('SHA-1 regression insertion marker is missing')
              text = text.replace(marker, regression + marker, 1)
              policy_test.write_text(text)
          PY

      - name: Prove both regressions fail before implementation
        run: |
          set +e
          npm run security:phase4:test
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Phase 4 evidence and SHA-1 regressions unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Redact embedded URLs and reject SHA-1 integrity
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('scripts/security/lib/live-supply-chain.mjs')
          text = live.read_text()
          if 'const URL_IN_TEXT_PATTERN' not in text:
              start_marker = 'const sanitizeString = (value) => {'
              end_marker = '\n\nconst shouldRedactField'
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start == -1 or end == -1:
                  raise RuntimeError('sanitizeString implementation markers are missing')
              replacement = """const URL_IN_TEXT_PATTERN = /https?:\/\/[^\s\"'<>]+/gi

          const sanitizeUrl = (value) => {
            try {
              const url = new URL(value)
              url.username = ''
              url.password = ''
              url.search = ''
              url.hash = ''
              return url.toString()
            } catch {
              return String(value)
                .replace(/(https?:\/\/)[^/@\s]+@/i, '$1[redacted]@')
                .replace(/[?#].*$/, '')
            }
          }

          const sanitizeString = (value) => String(value).replace(URL_IN_TEXT_PATTERN, sanitizeUrl)"""
              text = text[:start] + replacement + text[end:]
              live.write_text(text)

          policy = Path('scripts/security/lib/dependency-policy.mjs')
          text = policy.read_text()
          old = "const INTEGRITY_PATTERN = /^sha(?:1|256|384|512)-[A-Za-z0-9+/=]+$/"
          new = "const INTEGRITY_PATTERN = /^sha(?:256|384|512)-[A-Za-z0-9+/=]+$/"
          if new not in text:
              if old not in text:
                  raise RuntimeError('Integrity policy marker is missing')
              policy.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow from the permanent tree
        run: git rm -- .github/workflows/security-phase-4-finalizer-evidence-hardening.yml

      - name: Verify focused fixes and deterministic evidence
        run: |
          node --check scripts/security/lib/live-supply-chain.mjs
          node --check scripts/security/lib/dependency-policy.mjs
          npm run security:phase4:test

          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

      - name: Run complete Phase 4 reproduction
        run: npm run security:phase4:reproduce

      - name: Commit verified fixes and evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected Phase 4 evidence and integrity hardening changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): harden supply-chain evidence redaction'
          git fetch origin security/phase-4-dependency-supply-chain
          git rebase origin/security/phase-4-dependency-supply-chain
          git push origin HEAD:security/phase-4-dependency-supply-chain
