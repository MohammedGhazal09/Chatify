name: Temporary Phase 2 clean evidence export

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-clean-evidence-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-2-threat-model
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Generate evidence for the permanent Phase 2 tree
        run: |
          git rm --cached -- \
            .github/workflows/security-phase-2-bootstrap.yml \
            .github/workflows/security-phase-2-cleanup.yml \
            .github/workflows/security-phase-2-finalize.yml \
            .github/workflows/security-phase-2-source-repair.yml \
            .github/workflows/security-phase-2-verify-ready.yml
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:generate
          npm run security:phase2:check

      - name: Upload clean generated evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-2-clean-generated-evidence
          path: |
            docs/security/audit/phase-1/inventory.json
            docs/security/audit/phase-1/inventory.md
            docs/security/audit/phase-2/threat-model.json
            docs/security/audit/phase-2/threat-model.md
          if-no-files-found: error
          retention-days: 7
