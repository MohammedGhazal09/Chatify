name: Temporary Phase 4 policy parser finalization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-policy-parser-finalization
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-4-dependency-supply-chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch repository branches, tags, and current PR head
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/5/head:refs/remotes/pull/5/head'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Add valid parser-bypass regressions
        run: |
          cat > scripts/security/__tests__/phase4-policy-parser-hardening.test.mjs <<'EOF'
          import assert from 'node:assert/strict'
          import { mkdtemp, mkdir, readFile, writeFile } from 'node:fs/promises'
          import os from 'node:os'
          import path from 'node:path'
          import test from 'node:test'

          import { assertPhase4ExitGate, buildDependencyPolicy } from '../lib/dependency-policy.mjs'

          const NOW = new Date('2026-08-21T00:00:00.000Z')
          const writeJson = (filePath, value) => writeFile(filePath, `${JSON.stringify(value, null, 2)}\n`)

          const registryEntry = (name, version) => ({
            version,
            resolved: `https://registry.npmjs.org/${name}/-/${name}-${version}.tgz`,
            integrity: 'sha512-cGhhc2U0LXBvbGljeS1wYXJzZXItaGFyZGVuaW5nLWZpeHR1cmU=',
          })

          const lockfile = ({ name, dependencies, packageEntries }) => ({
            name,
            version: '1.0.0',
            lockfileVersion: 3,
            requires: true,
            packages: {
              '': { name, version: '1.0.0', dependencies },
              ...packageEntries,
            },
          })

          const createFixture = async () => {
            const root = await mkdtemp(path.join(os.tmpdir(), 'chatify-phase4-parser-'))
            const backend = path.join(root, 'Backend/Chatify')
            const frontend = path.join(root, 'Frontend/Chatify')
            const workflows = path.join(root, '.github/workflows')
            const docs = path.join(root, 'docs/security/audit/phase-4')
            await Promise.all([
              mkdir(backend, { recursive: true }),
              mkdir(frontend, { recursive: true }),
              mkdir(workflows, { recursive: true }),
              mkdir(docs, { recursive: true }),
            ])

            const backendManifest = {
              name: 'backend',
              version: '1.0.0',
              dependencies: { axios: '^1.18.0' },
              allowScripts: {},
            }
            const frontendManifest = {
              name: 'frontend',
              version: '1.0.0',
              dependencies: { react: '^19.2.0' },
              allowScripts: {},
            }
            await writeJson(path.join(backend, 'package.json'), backendManifest)
            await writeJson(path.join(frontend, 'package.json'), frontendManifest)
            await writeJson(path.join(backend, 'package-lock.json'), lockfile({
              name: 'backend',
              dependencies: backendManifest.dependencies,
              packageEntries: { 'node_modules/axios': registryEntry('axios', '1.18.0') },
            }))
            await writeJson(path.join(frontend, 'package-lock.json'), lockfile({
              name: 'frontend',
              dependencies: frontendManifest.dependencies,
              packageEntries: { 'node_modules/react': registryEntry('react', '19.2.0') },
            }))
            await writeFile(
              path.join(workflows, 'ci.yml'),
              'steps:\n  - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n',
            )
            await writeFile(path.join(root, '.github/dependabot.yml'), `version: 2
          updates:
            - package-ecosystem: npm
              directory: /Backend/Chatify
              schedule:
                interval: weekly
            - package-ecosystem: npm
              directory: /Frontend/Chatify
              schedule:
                interval: weekly
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
          `)
            await writeJson(path.join(docs, 'dependency-exceptions.json'), { schemaVersion: 1, entries: [] })
            await writeJson(path.join(docs, 'install-script-policy.json'), { schemaVersion: 1, entries: [] })
            return root
          }

          test('arbitrary npm distribution tags are rejected as mutable selectors', async () => {
            const root = await createFixture()
            const manifestPath = path.join(root, 'Backend/Chatify/package.json')
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            const parsedLock = JSON.parse(await readFile(lockPath, 'utf8'))
            manifest.dependencies.axios = 'stable'
            parsedLock.packages[''].dependencies.axios = 'stable'
            await writeJson(manifestPath, manifest)
            await writeJson(lockPath, parsedLock)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'manifest-selector-mutable-tag' && item.package === 'axios'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependencySourcesTrusted/)
          })

          test('inline flow-style mutable action references are detected', async () => {
            const root = await createFixture()
            await writeFile(
              path.join(root, '.github/workflows/ci.yml'),
              'steps:\n  - { name: Checkout, uses : actions/checkout@v4 }\n',
            )

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'workflow-action-mutable-ref' && item.path === '.github/workflows/ci.yml'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /remoteActionsPinned/)
          })

          test('Dependabot decoys and entries without schedules do not satisfy coverage', async () => {
            const root = await createFixture()
            await writeFile(path.join(root, '.github/dependabot.yml'), `version: 2
          documentation: |
            - package-ecosystem: npm
              directory: /Backend/Chatify
            - package-ecosystem: npm
              directory: /Frontend/Chatify
            - package-ecosystem: github-actions
              directory: /
          updates:
            - package-ecosystem: npm
              directory: /Backend/Chatify
          `)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.dependabot.complete, false)
            assert.equal(report.violations.some((item) => item.code === 'dependabot-coverage-missing'), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependabotCoverageComplete/)
          })
          EOF

      - name: Prove parser regressions fail before implementation
        run: |
          set +e
          node --test scripts/security/__tests__/phase4-policy-parser-hardening.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Phase 4 parser regressions unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Harden selectors, workflow action parsing, and Dependabot parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Expected patch marker missing from {path}: {old[:140]!r}')
              target.write_text(text.replace(old, new, 1))

          policy = Path('scripts/security/lib/dependency-policy.mjs')
          text = policy.read_text()

          exact = "const EXACT_VERSION_PATTERN = /^v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/\n"
          direct = "const DIRECT_SELECTOR_PATTERN = /^(?:\\^|~)?v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/\n"
          if direct not in text:
              if exact not in text:
                  raise RuntimeError('Direct selector constant marker is missing')
              text = text.replace(exact, exact + direct, 1)

          old_selector = """  if (/^(?:latest|next|beta|canary|\\*)$/i.test(value)) return 'mutable-tag'
          return 'semver'
          }
          """
          new_selector = """  if (DIRECT_SELECTOR_PATTERN.test(value)) return 'semver'
          if (value === '*' || /^[A-Za-z][A-Za-z0-9._-]*$/.test(value)) return 'mutable-tag'
          return 'unsupported'
          }
          """
          if new_selector not in text:
              if old_selector not in text:
                  raise RuntimeError('Selector policy marker is missing')
              text = text.replace(old_selector, new_selector, 1)

          parser_start = text.find('const scanWorkflows = async (root) => {')
          parser_end = text.find('\n\nconst serializeExceptions =', parser_start)
          if parser_start == -1 or parser_end == -1:
              raise RuntimeError('Workflow and Dependabot parser boundaries are missing')

          replacement = r'''const stripYamlComment = (line) => {
            let quote = null
            for (let index = 0; index < line.length; index += 1) {
              const character = line[index]
              if (quote) {
                if (quote === '"' && character === '\\') {
                  index += 1
                  continue
                }
                if (character === quote) {
                  if (quote === "'" && line[index + 1] === "'") {
                    index += 1
                    continue
                  }
                  quote = null
                }
                continue
              }
              if (character === '"' || character === "'") quote = character
              else if (character === '#') return line.slice(0, index)
            }
            return line
          }

          const readYamlScalarAt = (source, start = 0) => {
            let cursor = start
            while (cursor < source.length && /\s/.test(source[cursor])) cursor += 1
            const quote = source[cursor]
            if (quote === '"' || quote === "'") {
              let value = ''
              for (let index = cursor + 1; index < source.length; index += 1) {
                const character = source[index]
                if (quote === '"' && character === '\\' && index + 1 < source.length) {
                  value += source[index + 1]
                  index += 1
                  continue
                }
                if (character === quote) {
                  if (quote === "'" && source[index + 1] === "'") {
                    value += "'"
                    index += 1
                    continue
                  }
                  return { value, end: index + 1 }
                }
                value += character
              }
              return { value, end: source.length }
            }

            let end = cursor
            while (end < source.length && !/[\s,}#]/.test(source[end])) end += 1
            return { value: source.slice(cursor, end), end }
          }

          const parseYamlScalar = (raw) => readYamlScalarAt(stripYamlComment(String(raw ?? '')), 0).value.trim()

          const extractWorkflowUses = (line) => {
            const source = stripYamlComment(line)
            const references = new Set()
            const normal = /^\s*-?\s*["']?uses["']?\s*:\s*/.exec(source)
            if (normal) {
              const parsed = readYamlScalarAt(source, normal[0].length)
              if (parsed.value) references.add(parsed.value)
            }

            const flow = /(?:^|[{,])\s*["']?uses["']?\s*:\s*/g
            let match
            while ((match = flow.exec(source)) !== null) {
              const parsed = readYamlScalarAt(source, match.index + match[0].length)
              if (parsed.value) references.add(parsed.value)
              if (match[0].length === 0) flow.lastIndex += 1
            }
            return [...references]
          }

          const scanWorkflows = async (root) => {
            const workflowFiles = (await listFilesRecursively(root, WORKFLOWS_PATH))
              .filter((file) => /\.ya?ml$/i.test(file))
              .sort()
            const remoteActions = []
            const violations = []

            for (const workflowPath of workflowFiles) {
              const text = await readFile(path.join(root, workflowPath), 'utf8')
              let blockScalarIndent = null
              for (const [lineIndex, lineText] of text.split('\n').entries()) {
                const indent = lineText.match(/^ */)?.[0].length ?? 0
                if (blockScalarIndent !== null) {
                  if (!lineText.trim()) continue
                  if (indent > blockScalarIndent) continue
                  blockScalarIndent = null
                }

                const uncommented = stripYamlComment(lineText)
                if (/^\s*[^:]+:\s*[>|][+-]?\s*$/.test(uncommented)) {
                  blockScalarIndent = indent
                  continue
                }

                for (const reference of extractWorkflowUses(lineText)) {
                  const line = lineIndex + 1
                  if (reference.startsWith('./')) continue
                  if (reference.startsWith('docker://')) {
                    const pinned = /@sha256:[a-f0-9]{64}$/i.test(reference)
                    remoteActions.push({ workflowPath, line, action: reference, ref: null, pinned, type: 'docker' })
                    if (!pinned) {
                      violations.push(violation('workflow-action-mutable-ref', `Docker action ${reference} is not pinned by digest.`, {
                        path: workflowPath,
                      }))
                    }
                    continue
                  }
                  const parsed = REMOTE_ACTION_PATTERN.exec(reference)
                  const action = parsed?.[1] ?? reference
                  const actionRef = parsed?.[2] ?? ''
                  const pinned = FULL_SHA_PATTERN.test(actionRef)
                  remoteActions.push({ workflowPath, line, action, ref: actionRef, pinned, type: 'github' })
                  if (!pinned) {
                    violations.push(violation('workflow-action-mutable-ref', `Remote action ${reference} is not pinned to a full commit SHA.`, {
                      path: workflowPath,
                    }))
                  }
                }
              }
            }

            remoteActions.sort((left, right) => `${left.workflowPath}:${left.line}:${left.action}`.localeCompare(`${right.workflowPath}:${right.line}:${right.action}`))
            return { workflowFiles, remoteActions, violations }
          }

          const parseDependabot = async (root) => {
            const absolute = path.join(root, DEPENDABOT_PATH)
            const required = [
              { ecosystem: 'npm', directory: '/Backend/Chatify' },
              { ecosystem: 'npm', directory: '/Frontend/Chatify' },
              { ecosystem: 'github-actions', directory: '/' },
            ]
            if (!await exists(absolute)) {
              return {
                path: DEPENDABOT_PATH,
                version: null,
                entries: [],
                required,
                missing: required,
                complete: false,
                violations: [violation('dependabot-coverage-missing', 'Dependabot configuration is missing.', { path: DEPENDABOT_PATH })],
              }
            }

            const lines = (await readFile(absolute, 'utf8')).split('\n')
            const entries = []
            let version = null
            let inUpdates = false
            let current = null
            let inSchedule = false
            const commitCurrent = () => {
              if (current) entries.push(current)
              current = null
              inSchedule = false
            }

            for (const rawLine of lines) {
              const line = stripYamlComment(rawLine)
              if (!line.trim()) continue
              const indent = line.match(/^ */)?.[0].length ?? 0
              const trimmed = line.trim()

              if (indent === 0) {
                commitCurrent()
                const versionMatch = /^version\s*:\s*(.+)$/.exec(trimmed)
                if (versionMatch) version = parseYamlScalar(versionMatch[1])
                inUpdates = /^updates\s*:\s*$/.test(trimmed)
                continue
              }
              if (!inUpdates) continue

              if (indent === 2) {
                commitCurrent()
                const ecosystemMatch = /^-\s*package-ecosystem\s*:\s*(.+)$/.exec(trimmed)
                if (ecosystemMatch) {
                  current = {
                    ecosystem: parseYamlScalar(ecosystemMatch[1]),
                    directory: null,
                    scheduleInterval: null,
                  }
                }
                continue
              }
              if (!current) continue

              if (indent === 4) {
                inSchedule = /^schedule\s*:\s*$/.test(trimmed)
                const directoryMatch = /^directory\s*:\s*(.+)$/.exec(trimmed)
                if (directoryMatch) current.directory = parseYamlScalar(directoryMatch[1])
                continue
              }
              if (indent === 6 && inSchedule) {
                const intervalMatch = /^interval\s*:\s*(.+)$/.exec(trimmed)
                if (intervalMatch) current.scheduleInterval = parseYamlScalar(intervalMatch[1])
              }
            }
            commitCurrent()

            entries.sort((left, right) => `${left.ecosystem}:${left.directory}`.localeCompare(`${right.ecosystem}:${right.directory}`))
            const validIntervals = new Set(['daily', 'weekly', 'monthly'])
            const missing = required.filter((item) => !entries.some((entry) => (
              entry.ecosystem === item.ecosystem
              && entry.directory === item.directory
              && validIntervals.has(entry.scheduleInterval)
            )))
            const violations = []
            if (version !== '2') {
              violations.push(violation('dependabot-version-invalid', 'Dependabot configuration must use version 2.', {
                path: DEPENDABOT_PATH,
              }))
            }
            if (missing.length > 0) {
              violations.push(violation('dependabot-coverage-missing', `Dependabot is missing scheduled coverage for ${missing.map((item) => `${item.ecosystem}:${item.directory}`).join(', ')}.`, {
                path: DEPENDABOT_PATH,
              }))
            }
            return {
              path: DEPENDABOT_PATH,
              version,
              entries,
              required,
              missing,
              complete: version === '2' && missing.length === 0,
              violations,
            }
          }'''

          text = text[:parser_start] + replacement + text[parser_end:]

          old_report = """    dependabot: {
              path: dependabot.path,
              entries: dependabot.entries,
          """
          new_report = """    dependabot: {
              path: dependabot.path,
              version: dependabot.version,
              entries: dependabot.entries,
          """
          if new_report not in text:
              if old_report not in text:
                  raise RuntimeError('Dependabot report marker is missing')
              text = text.replace(old_report, new_report, 1)

          policy.write_text(text)

          readme = Path('docs/security/audit/phase-4/README.md')
          documentation = readme.read_text()
          documentation = documentation.replace(
              '| Policy tests | `scripts/security/__tests__/phase4-dependency-policy.test.mjs` | Prove unsafe sources, integrity gaps, stale lockfiles, mutable actions, invalid exceptions, and script-policy drift fail closed. |',
              '| Policy tests | `scripts/security/__tests__/phase4-dependency-policy.test.mjs` and `phase4-policy-parser-hardening.test.mjs` | Prove unsafe sources, integrity gaps, mutable selectors, block/flow-style action references, Dependabot schedule decoys, invalid exceptions, and script-policy drift fail closed. |',
          )
          marker = '- wildcard, vague, unowned, expired, long-lived, duplicate, or critical advisory exceptions.\n'
          paragraph = '\nSelector parsing accepts only exact, caret, or tilde semantic versions and rejects arbitrary npm distribution tags or unsupported selector syntax. Workflow scanning covers block-style and flow-style `uses` keys while ignoring comments and block scalars. Dependabot coverage is accepted only from top-level `updates` entries with version 2 and a daily, weekly, or monthly schedule.\n'
          if paragraph.strip() not in documentation:
              if marker not in documentation:
                  raise RuntimeError('Phase 4 README parser-hardening marker is missing')
              documentation = documentation.replace(marker, marker + paragraph, 1)
          readme.write_text(documentation)
          PY

      - name: Remove temporary workflow and commit source changes
        run: |
          git rm -- .github/workflows/security-phase-4-finalizer-policy-parser-hardening.yml
          git add \
            scripts/security/__tests__/phase4-policy-parser-hardening.test.mjs \
            scripts/security/lib/dependency-policy.mjs \
            docs/security/audit/phase-4/README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): harden Phase 4 policy parsers'

      - name: Verify parser regressions and complete Phase 4 policy suite
        run: |
          node --check scripts/security/lib/dependency-policy.mjs
          node --test scripts/security/__tests__/phase4-policy-parser-hardening.test.mjs
          npm run security:phase4:test

      - name: Regenerate stable Phase 1 through Phase 4 evidence
        run: |
          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs(security): refresh parser-hardened Phase 1 through Phase 4 evidence'
          fi

      - name: Run complete Phase 4 reproduction on final local commits
        run: npm run security:phase4:reproduce

      - name: Push verified permanent tree
        run: git push origin HEAD:security/phase-4-dependency-supply-chain
