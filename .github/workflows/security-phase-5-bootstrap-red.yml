name: Temporary Phase 5 TDD red proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-tdd-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-red:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-5-authentication-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-5-authentication-session
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json

      - name: Install backend with reviewed lifecycle scripts
        working-directory: Backend/Chatify
        run: npm ci --strict-allow-scripts

      - name: Prove Phase 5 runtime contract is red
        run: |
          set +e
          npm --prefix Backend/Chatify test -- --run test/auth/phase5-authentication-security.test.mjs \
            2>&1 | tee /tmp/phase5-red.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo 'Phase 5 regressions unexpectedly passed before implementation.' >&2
            exit 1
          fi

          grep -F 'Phase 5 authentication and session invariants' /tmp/phase5-red.log
          grep -E 'failed|FAIL|AssertionError|expected' /tmp/phase5-red.log >/dev/null
          echo 'Observed the required failing Phase 5 regression run before production changes.'

      - name: Upload red proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-5-tdd-red-proof
          path: /tmp/phase5-red.log
          if-no-files-found: error
          retention-days: 14
