name: Security Phase 16 Frontend and Browser

on:
  push:
    branches:
      - security/phase-16-frontend-browser-security
  pull_request:
    branches:
      - security/phase-15-webrtc-call-security
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-16-browser-security:
    name: Browser origins, navigation, routing, and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Frontend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Install controlled frontend dependencies
        run: npm --prefix Frontend/Chatify ci --strict-allow-scripts

      - name: Run Phase 16 browser regressions
        run: |
          npm --prefix Frontend/Chatify test -- --run \
            src/security/browserSecurity.test.ts \
            src/security/browserPolicy.test.ts \
            src/api/apiOrigin.test.ts \
            src/api/axios.test.ts \
            src/components/protectedRoute.test.tsx \
            src/hooks/useAuthRedirect.test.tsx

      - name: Run frontend lint
        run: npm --prefix Frontend/Chatify run lint

      - name: Build production browser artifact
        run: npm --prefix Frontend/Chatify run build

      - name: Audit production dependencies
        run: npm --prefix Frontend/Chatify audit --omit=dev --audit-level=high

      - name: Verify patch hygiene
        run: git diff --check HEAD^ HEAD
