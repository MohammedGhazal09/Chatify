name: Temporary repository security audit

on:
  push:
    branches:
      - security/audit-plan-20260824
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export immutable review source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          git rev-parse HEAD > audit-results/commit-sha.txt
          git status --porcelain=v1 > audit-results/git-status.txt
          git ls-files -s > audit-results/tracked-files-with-modes.txt
          git ls-files | sort > audit-results/tracked-files.txt
          git log --all --decorate --oneline > audit-results/git-history.txt
          tar --exclude=.git --exclude=audit-results --exclude=node_modules -czf audit-results/repository-source.tar.gz .

      - name: Upload immutable source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatify-audit-bundle
          path: audit-results/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
