name: Temporary Phase 4 policy parser retry

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-policy-parser-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-4-dependency-supply-chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Add policy parser bypass regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/security/__tests__/phase4-dependency-policy.test.mjs')
          text = path.read_text()
          regressions = r"""test('arbitrary npm distribution tags are rejected as mutable selectors', async () => {
            const root = await createFixture()
            const manifestPath = path.join(root, 'Backend/Chatify/package.json')
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            const parsedLock = JSON.parse(await readFile(lockPath, 'utf8'))
            manifest.dependencies.axios = 'stable'
            parsedLock.packages[''].dependencies.axios = 'stable'
            await writeJson(manifestPath, manifest)
            await writeJson(lockPath, parsedLock)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'manifest-selector-mutable-tag'
              && item.package === 'axios'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependencySourcesTrusted/)
          })

          test('inline flow-style mutable action references are detected', async () => {
            const root = await createFixture()
            await writeFile(
              path.join(root, '.github/workflows/ci.yml'),
              'steps:\n  - { name: Checkout, uses : actions/checkout@v4 }\n',
            )

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'workflow-action-mutable-ref'
              && item.path === '.github/workflows/ci.yml'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /remoteActionsPinned/)
          })

          test('dependabot decoys and entries without schedules do not satisfy coverage', async () => {
            const root = await createFixture()
            await writeFile(path.join(root, '.github/dependabot.yml'), `version: 2
          documentation: |
            - package-ecosystem: npm
              directory: /Backend/Chatify
            - package-ecosystem: npm
              directory: /Frontend/Chatify
            - package-ecosystem: github-actions
              directory: /
          updates:
            - package-ecosystem: npm
              directory: /Backend/Chatify
          `)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.dependabot.complete, false)
            assert.equal(report.violations.some((item) => item.code === 'dependabot-coverage-missing'), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependabotCoverageComplete/)
          })

          """
          if 'arbitrary npm distribution tags are rejected as mutable selectors' not in text:
              marker = "test('unsafe sources, missing integrity, mutable actions, and missing update coverage fail closed', async () => {"
              if marker not in text:
                  raise RuntimeError('Policy parser regression insertion marker is missing')
              path.write_text(text.replace(marker, regressions + marker, 1))
          PY

      - name: Prove parser bypass regressions fail before implementation
        run: |
          set +e
          npm run security:phase4:test
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Phase 4 policy parser regressions unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Harden dependency selectors, workflow action parsing, and Dependabot parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('scripts/security/lib/dependency-policy.mjs')
          text = policy.read_text()

          exact = "const EXACT_VERSION_PATTERN = /^v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/\n"
          direct = "const DIRECT_SELECTOR_PATTERN = /^(?:\\^|~)?v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/\n"
          if direct not in text:
              if exact not in text:
                  raise RuntimeError('Direct selector constant marker is missing')
              text = text.replace(exact, exact + direct, 1)

          old_selector = """  if (/^(?:latest|next|beta|canary|\\*)$/i.test(value)) return 'mutable-tag'
            return 'semver'
          }
          """
          new_selector = """  if (DIRECT_SELECTOR_PATTERN.test(value)) return 'semver'
            if (value === '*' || /^[A-Za-z][A-Za-z0-9._-]*$/.test(value)) return 'mutable-tag'
            return 'unsupported'
          }
          """
          if new_selector not in text:
              if old_selector not in text:
                  raise RuntimeError('Selector policy marker is missing')
              text = text.replace(old_selector, new_selector, 1)

          scan_start = text.find('const scanWorkflows = async (root) => {')
          scan_end = text.find('\n\nconst parseDependabot = async (root) => {', scan_start)
          if scan_start == -1 or scan_end == -1:
              raise RuntimeError('Workflow scanner boundaries are missing')
          workflow_scanner = r'''const readQuotedYamlScalar = (source, start) => {
            const quote = source[start]
            let value = ''
            for (let index = start + 1; index < source.length; index += 1) {
              const character = source[index]
              if (quote === '"' && character === '\\' && index + 1 < source.length) {
                value += source[index + 1]
                index += 1
                continue
              }
              if (character === quote) {
                if (quote === "'" && source[index + 1] === "'") {
                  value += "'"
                  index += 1
                  continue
                }
                return { value, end: index + 1 }
              }
              value += character
            }
            return { value, end: source.length }
          }

          const extractWorkflowUses = (line) => {
            const references = []
            let index = 0
            while (index < line.length) {
              const character = line[index]
              if (character === '#') break

              const keyStart = index
              let keyEnd = index
              if (character === '"' || character === "'") {
                const parsed = readQuotedYamlScalar(line, index)
                if (parsed.value !== 'uses') {
                  index = parsed.end
                  continue
                }
                keyEnd = parsed.end
              } else if (line.slice(index, index + 4) === 'uses') {
                const before = line[index - 1] ?? ''
                const after = line[index + 4] ?? ''
                if (/[A-Za-z0-9_-]/.test(before) || /[A-Za-z0-9_-]/.test(after)) {
                  index += 4
                  continue
                }
                keyEnd = index + 4
              } else {
                index += 1
                continue
              }

              let prefix = keyStart - 1
              while (prefix >= 0 && /\s/.test(line[prefix])) prefix -= 1
              if (prefix >= 0 && !['-', '{', ','].includes(line[prefix])) {
                index = keyEnd
                continue
              }

              let cursor = keyEnd
              while (cursor < line.length && /\s/.test(line[cursor])) cursor += 1
              if (line[cursor] !== ':') {
                index = keyEnd
                continue
              }
              cursor += 1
              while (cursor < line.length && /\s/.test(line[cursor])) cursor += 1

              let value = ''
              let end = cursor
              if (line[cursor] === '"' || line[cursor] === "'") {
                const parsed = readQuotedYamlScalar(line, cursor)
                value = parsed.value
                end = parsed.end
              } else {
                while (end < line.length && !/[\s,}#]/.test(line[end])) end += 1
                value = line.slice(cursor, end)
              }
              if (value) references.push(value)
              index = Math.max(end, keyEnd)
            }
            return references
          }

          const scanWorkflows = async (root) => {
            const workflowFiles = (await listFilesRecursively(root, WORKFLOWS_PATH))
              .filter((file) => /\.ya?ml$/i.test(file))
              .sort()
            const remoteActions = []
            const violations = []

            for (const workflowPath of workflowFiles) {
              const text = await readFile(path.join(root, workflowPath), 'utf8')
              for (const [lineIndex, lineText] of text.split('\n').entries()) {
                for (const reference of extractWorkflowUses(lineText)) {
                  const line = lineIndex + 1
                  if (reference.startsWith('./')) continue
                  if (reference.startsWith('docker://')) {
                    const pinned = /@sha256:[a-f0-9]{64}$/i.test(reference)
                    remoteActions.push({ workflowPath, line, action: reference, ref: null, pinned, type: 'docker' })
                    if (!pinned) {
                      violations.push(violation('workflow-action-mutable-ref', `Docker action ${reference} is not pinned by digest.`, {
                        path: workflowPath,
                      }))
                    }
                    continue
                  }
                  const parsed = REMOTE_ACTION_PATTERN.exec(reference)
                  const action = parsed?.[1] ?? reference
                  const actionRef = parsed?.[2] ?? ''
                  const pinned = FULL_SHA_PATTERN.test(actionRef)
                  remoteActions.push({ workflowPath, line, action, ref: actionRef, pinned, type: 'github' })
                  if (!pinned) {
                    violations.push(violation('workflow-action-mutable-ref', `Remote action ${reference} is not pinned to a full commit SHA.`, {
                      path: workflowPath,
                    }))
                  }
                }
              }
            }

            remoteActions.sort((left, right) => `${left.workflowPath}:${left.line}:${left.action}`.localeCompare(`${right.workflowPath}:${right.line}:${right.action}`))
            return { workflowFiles, remoteActions, violations }
          }'''
          text = text[:scan_start] + workflow_scanner + text[scan_end:]

          dependabot_start = text.find('const parseDependabot = async (root) => {')
          dependabot_end = text.find('\n\nconst serializeExceptions =', dependabot_start)
          if dependabot_start == -1 or dependabot_end == -1:
              raise RuntimeError('Dependabot parser boundaries are missing')
          dependabot_parser = r'''const parseYamlScalar = (raw) => {
            const value = String(raw ?? '').trim()
            if (value.startsWith('"') || value.startsWith("'")) {
              return readQuotedYamlScalar(value, 0).value
            }
            return value.replace(/\s+#.*$/, '').trim()
          }

          const parseDependabot = async (root) => {
            const absolute = path.join(root, DEPENDABOT_PATH)
            const required = [
              { ecosystem: 'npm', directory: '/Backend/Chatify' },
              { ecosystem: 'npm', directory: '/Frontend/Chatify' },
              { ecosystem: 'github-actions', directory: '/' },
            ]
            if (!await exists(absolute)) {
              return {
                path: DEPENDABOT_PATH,
                version: null,
                entries: [],
                required,
                missing: required,
                complete: false,
                violations: [violation('dependabot-coverage-missing', 'Dependabot configuration is missing.', { path: DEPENDABOT_PATH })],
              }
            }

            const lines = (await readFile(absolute, 'utf8')).split('\n')
            const entries = []
            let version = null
            let inUpdates = false
            let current = null
            let inSchedule = false
            const commitCurrent = () => {
              if (current) entries.push(current)
              current = null
              inSchedule = false
            }

            for (const line of lines) {
              if (!line.trim() || line.trimStart().startsWith('#')) continue
              const indent = line.match(/^ */)?.[0].length ?? 0
              const trimmed = line.trim()

              if (indent === 0) {
                commitCurrent()
                const versionMatch = /^version\s*:\s*(.+)$/.exec(trimmed)
                if (versionMatch) version = parseYamlScalar(versionMatch[1])
                inUpdates = /^updates\s*:\s*$/.test(trimmed)
                continue
              }
              if (!inUpdates) continue

              if (indent === 2) {
                commitCurrent()
                const ecosystemMatch = /^-\s*package-ecosystem\s*:\s*(.+)$/.exec(trimmed)
                if (ecosystemMatch) {
                  current = {
                    ecosystem: parseYamlScalar(ecosystemMatch[1]),
                    directory: null,
                    scheduleInterval: null,
                  }
                }
                continue
              }
              if (!current) continue

              if (indent === 4) {
                inSchedule = /^schedule\s*:\s*$/.test(trimmed)
                const directoryMatch = /^directory\s*:\s*(.+)$/.exec(trimmed)
                if (directoryMatch) current.directory = parseYamlScalar(directoryMatch[1])
                continue
              }
              if (indent === 6 && inSchedule) {
                const intervalMatch = /^interval\s*:\s*(.+)$/.exec(trimmed)
                if (intervalMatch) current.scheduleInterval = parseYamlScalar(intervalMatch[1])
              }
            }
            commitCurrent()

            entries.sort((left, right) => `${left.ecosystem}:${left.directory}`.localeCompare(`${right.ecosystem}:${right.directory}`))
            const validIntervals = new Set(['daily', 'weekly', 'monthly'])
            const missing = required.filter((item) => !entries.some((entry) => (
              entry.ecosystem === item.ecosystem
              && entry.directory === item.directory
              && validIntervals.has(entry.scheduleInterval)
            )))
            const violations = []
            if (version !== '2') {
              violations.push(violation('dependabot-version-invalid', 'Dependabot configuration must use version 2.', {
                path: DEPENDABOT_PATH,
              }))
            }
            if (missing.length > 0) {
              violations.push(violation('dependabot-coverage-missing', `Dependabot is missing scheduled coverage for ${missing.map((item) => `${item.ecosystem}:${item.directory}`).join(', ')}.`, {
                path: DEPENDABOT_PATH,
              }))
            }
            return {
              path: DEPENDABOT_PATH,
              version,
              entries,
              required,
              missing,
              complete: version === '2' && missing.length === 0,
              violations,
            }
          }'''
          text = text[:dependabot_start] + dependabot_parser + text[dependabot_end:]

          report_marker = "    dependabot: {\n      path: dependabot.path,\n"
          report_replacement = "    dependabot: {\n      path: dependabot.path,\n      version: dependabot.version,\n"
          if report_replacement not in text:
              if report_marker not in text:
                  raise RuntimeError('Dependabot report marker is missing')
              text = text.replace(report_marker, report_replacement, 1)

          policy.write_text(text)
          PY

      - name: Remove temporary workflows from the permanent tree
        run: |
          git rm --ignore-unmatch \
            .github/workflows/security-phase-4-finalizer-policy-parser-hardening.yml \
            .github/workflows/security-phase-4-finalizer-policy-parser-retry.yml

      - name: Verify focused hardening and deterministic evidence
        run: |
          node --check scripts/security/lib/dependency-policy.mjs
          npm run security:phase4:test

          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

      - name: Run complete Phase 4 reproduction
        run: npm run security:phase4:reproduce

      - name: Commit verified hardening and evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected Phase 4 policy parser hardening changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): harden supply-chain policy parsers'
          git fetch origin security/phase-4-dependency-supply-chain
          git rebase origin/security/phase-4-dependency-supply-chain
          git push origin HEAD:security/phase-4-dependency-supply-chain
