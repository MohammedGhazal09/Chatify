name: Temporary frontend lockfile refresh

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-frontend-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
      - name: Resolve and audit the Vite 8 dependency graph
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'Frontend/Chatify/package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.devDependencies.vite = '^8.0.0'
          pkg.devDependencies['@vitejs/plugin-react'] = '^6.0.0'
          pkg.allowScripts = {
            '@tailwindcss/oxide@4.1.11': true,
            fsevents: false,
          }
          pkg.engines = {
            node: '>=24.19.0 <25',
            npm: '>=11.17.0 <12',
          }
          pkg.packageManager = 'npm@11.17.0'
          delete pkg.overrides
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          cd Frontend/Chatify
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          set +e
          npm audit --audit-level=low --json > ../../frontend-audit.json
          audit_status=$?
          set -e
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const vite = lock.packages['node_modules/vite']?.version
          const plugin = lock.packages['node_modules/@vitejs/plugin-react']?.version
          if (!vite?.startsWith('8.')) throw new Error(`expected Vite 8, resolved ${vite}`)
          if (!plugin?.startsWith('6.')) throw new Error(`expected plugin-react 6, resolved ${plugin}`)
          if (lock.packages['node_modules/esbuild']) throw new Error('legacy esbuild dependency remains')
          console.log(JSON.stringify({ vite, plugin, esbuild: null }))
          NODE
          mkdir -p ../../frontend-lockfile/Frontend/Chatify
          cp package.json package-lock.json ../../frontend-lockfile/Frontend/Chatify/
          cp ../../frontend-audit.json ../../frontend-lockfile/
          printf '%s\n' "$audit_status" > ../../frontend-lockfile/frontend-audit-exit.txt
          cat ../../frontend-audit.json
      - name: Upload audited frontend lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatify-frontend-vite8-lockfile
          path: frontend-lockfile/
          if-no-files-found: error
          retention-days: 1
      - name: Enforce zero dependency advisories
        shell: bash
        run: test "$(cat frontend-lockfile/frontend-audit-exit.txt)" -eq 0
