name: Temporary Phase 4 downstream-evidence finalization

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-downstream-evidence-finalization
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-4-dependency-supply-chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch repository branches, tags, and current PR head
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/5/head:refs/remotes/pull/5/head'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Prove downstream-evidence regression fails before implementation
        run: |
          set +e
          node --test scripts/security/__tests__/phase3-downstream-generated-evidence.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Downstream generated-evidence regression unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Exclude Phase 4 generated evidence from Phase 3 inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Expected patch marker missing from {path}: {old[:140]!r}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/security/lib/secret-scan.mjs',
              "  'docs/security/audit/phase-2/threat-model.md',\n  GENERATED_JSON,\n",
              "  'docs/security/audit/phase-2/threat-model.md',\n  'docs/security/audit/phase-4/dependency-policy.json',\n  'docs/security/audit/phase-4/dependency-policy.md',\n  GENERATED_JSON,\n",
          )

          readme = Path('docs/security/audit/phase-3/README.md')
          text = readme.read_text()
          marker = 'Generated Phase 1–3 JSON/Markdown evidence and temporary audit-materialization workflows are excluded from scan inputs to prevent recursive evidence loops.'
          replacement = 'Generated Phase 1–4 JSON/Markdown evidence and temporary audit-materialization workflows are excluded from scan inputs to prevent recursive evidence loops across stacked audit phases.'
          if replacement not in text:
              if marker not in text:
                  raise RuntimeError('Phase 3 generated-evidence documentation marker is missing')
              text = text.replace(marker, replacement, 1)
          readme.write_text(text)

          plan = Path('docs/plans/2026-08-21-phase-3-secrets-and-credentials.md')
          text = plan.read_text()
          marker = '4. Exclude generated Phase 3 JSON and Markdown from their own current/history inputs to prevent recursive drift.'
          replacement = '4. Exclude generated Phase 1–4 audit JSON and Markdown from Phase 3 current/history inputs to prevent recursive drift across stacked phases.'
          if replacement not in text:
              if marker not in text:
                  raise RuntimeError('Phase 3 implementation-plan evidence marker is missing')
              text = text.replace(marker, replacement, 1)
          plan.write_text(text)
          PY

      - name: Remove temporary workflow and push permanent source fix
        run: |
          git rm -- .github/workflows/security-phase-4-finalizer-downstream-evidence.yml
          git add \
            scripts/security/lib/secret-scan.mjs \
            docs/security/audit/phase-3/README.md \
            docs/plans/2026-08-21-phase-3-secrets-and-credentials.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): exclude Phase 4 generated audit evidence'
          git push origin HEAD:security/phase-4-dependency-supply-chain

      - name: Refresh authoritative refs after source push
        run: |
          git fetch --force origin \
            '+refs/heads/security/phase-4-dependency-supply-chain:refs/remotes/origin/security/phase-4-dependency-supply-chain'
          git update-ref refs/remotes/pull/5/head HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/security/phase-4-dependency-supply-chain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/pull/5/head)"

      - name: Verify focused Phase 3 and Phase 4 controls
        run: |
          node --check scripts/security/lib/secret-scan.mjs
          node --test scripts/security/__tests__/phase3-downstream-generated-evidence.test.mjs
          npm run security:phase3:test
          npm run security:phase4:test

      - name: Regenerate stable Phase 1 through Phase 4 evidence
        run: |
          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

      - name: Commit final deterministic evidence
        run: |
          git add \
            docs/security/audit/phase-1/inventory.json \
            docs/security/audit/phase-1/inventory.md \
            docs/security/audit/phase-2/threat-model.json \
            docs/security/audit/phase-2/threat-model.md \
            docs/security/audit/phase-3/secret-scan.json \
            docs/security/audit/phase-3/secret-scan.md \
            docs/security/audit/phase-4/dependency-policy.json \
            docs/security/audit/phase-4/dependency-policy.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected deterministic evidence changes were not produced.' >&2
            exit 1
          fi
          git commit -m 'docs(security): finalize Phase 4 deterministic evidence'

      - name: Run complete Phase 4 reproduction on final commit
        run: npm run security:phase4:reproduce

      - name: Push verified final evidence commit
        run: git push origin HEAD:security/phase-4-dependency-supply-chain
