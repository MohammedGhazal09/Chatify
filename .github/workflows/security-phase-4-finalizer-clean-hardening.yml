name: Temporary Phase 4 clean hardening finalizer

on:
  push:
    branches:
      - security/phase-4-supply-chain-final
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-clean-hardening-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout isolated Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-supply-chain-final
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Add focused supply-chain bypass regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          live_test = Path('scripts/security/__tests__/phase4-live-supply-chain.test.mjs')
          live_text = live_test.read_text()
          message_line = "    message: ['request to https://user:', 'password@registry.example.test/npm?token=abc#fragment failed'].join(''),\n"
          if message_line not in live_text:
              registry_line = "    registry: 'https://user:password@registry.example.test/npm?token=abc#fragment',\n"
              if registry_line not in live_text:
                  raise RuntimeError('Structured-evidence fixture marker is missing')
              live_text = live_text.replace(registry_line, registry_line + message_line, 1)
          message_assertion = "  assert.equal(sanitized.message, 'request to https://registry.example.test/npm failed')\n"
          if message_assertion not in live_text:
              registry_assertion = "  assert.equal(sanitized.registry, 'https://registry.example.test/npm')\n"
              if registry_assertion not in live_text:
                  raise RuntimeError('Structured-evidence assertion marker is missing')
              live_text = live_text.replace(registry_assertion, registry_assertion + message_assertion, 1)
          live_test.write_text(live_text)

          policy_test = Path('scripts/security/__tests__/phase4-dependency-policy.test.mjs')
          policy_text = policy_test.read_text()
          regressions = r"""test('obsolete SHA-1 lockfile integrity is rejected', async () => {
            const root = await createFixture()
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const parsed = JSON.parse(await readFile(lockPath, 'utf8'))
            parsed.packages['node_modules/axios'].integrity = 'sha1-QUJDRA=='
            await writeJson(lockPath, parsed)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'dependency-integrity-missing'
              && item.package === 'axios'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependencyIntegrityComplete/)
          })

          test('arbitrary npm distribution tags are rejected as mutable selectors', async () => {
            const root = await createFixture()
            const manifestPath = path.join(root, 'Backend/Chatify/package.json')
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
            const parsedLock = JSON.parse(await readFile(lockPath, 'utf8'))
            manifest.dependencies.axios = 'stable'
            parsedLock.packages[''].dependencies.axios = 'stable'
            await writeJson(manifestPath, manifest)
            await writeJson(lockPath, parsedLock)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'manifest-selector-mutable-tag'
              && item.package === 'axios'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependencySourcesTrusted/)
          })

          test('inline flow-style mutable action references are detected', async () => {
            const root = await createFixture()
            await writeFile(
              path.join(root, '.github/workflows/ci.yml'),
              'steps:\n  - { name: Checkout, "uses" : actions/checkout@v4 }\n',
            )

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'workflow-action-mutable-ref'
              && item.path === '.github/workflows/ci.yml'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /remoteActionsPinned/)
          })

          test('full commit pinning does not trust an unapproved action owner', async () => {
            const root = await createFixture()
            await writeFile(
              path.join(root, '.github/workflows/ci.yml'),
              'steps:\n  - uses: untrusted-owner/build-action@0123456789abcdef0123456789abcdef01234567\n',
            )

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'workflow-action-untrusted'
              && item.path === '.github/workflows/ci.yml'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /remoteActionsTrusted/)
          })

          test('Dependabot decoys and entries without schedules do not satisfy coverage', async () => {
            const root = await createFixture()
            await writeFile(path.join(root, '.github/dependabot.yml'), `version: 2
          documentation: |
            - package-ecosystem: npm
              directory: /Backend/Chatify
            - package-ecosystem: npm
              directory: /Frontend/Chatify
            - package-ecosystem: github-actions
              directory: /
          updates:
            - package-ecosystem: npm
              directory: /Backend/Chatify
          `)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.dependabot.complete, false)
            assert.equal(report.violations.some((item) => item.code === 'dependabot-coverage-missing'), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependabotCoverageComplete/)
          })

          """
          if 'obsolete SHA-1 lockfile integrity is rejected' not in policy_text:
              marker = "test('unsafe sources, missing integrity, mutable actions, and missing update coverage fail closed', async () => {"
              if marker not in policy_text:
                  raise RuntimeError('Phase 4 regression insertion marker is missing')
              policy_test.write_text(policy_text.replace(marker, regressions + marker, 1))
          PY

          node --check scripts/security/__tests__/phase4-live-supply-chain.test.mjs
          node --check scripts/security/__tests__/phase4-dependency-policy.test.mjs

      - name: Prove regressions fail before implementation
        run: |
          set +e
          npm run security:phase4:test
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'The new Phase 4 bypass regressions unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Harden evidence, dependency, workflow, and update parsers
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('scripts/security/lib/live-supply-chain.mjs')
          live_text = live.read_text()
          start = live_text.find('const sanitizeString = (value) => {')
          end = live_text.find('\n\nconst shouldRedactField', start)
          if start == -1 or end == -1:
              raise RuntimeError('Structured-evidence sanitizer boundaries are missing')
          replacement = r'''const URL_IN_TEXT_PATTERN = /https?:\/\/[^\s"'<>]+/gi

          const sanitizeUrl = (value) => {
            try {
              const url = new URL(value)
              url.username = ''
              url.password = ''
              url.search = ''
              url.hash = ''
              return url.toString()
            } catch {
              return String(value)
                .replace(/(https?:\/\/)[^/@\s]+@/i, '$1[redacted]@')
                .replace(/[?#].*$/, '')
            }
          }

          const sanitizeString = (value) => String(value).replace(URL_IN_TEXT_PATTERN, sanitizeUrl)'''
          live.write_text(live_text[:start] + replacement + live_text[end:])

          policy = Path('scripts/security/lib/dependency-policy.mjs')
          text = policy.read_text()

          old_constants = """const EXACT_VERSION_PATTERN = /^v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/
          const ADVISORY_ID_PATTERN ="""
          new_constants = """const EXACT_VERSION_PATTERN = /^v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/
          const DIRECT_SELECTOR_PATTERN = /^(?:\\^|~)?v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/
          const COMPARATOR_SET_PATTERN = /^(?:(?:<=|>=|<|>|=)?v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)(?:\\s+(?:<=|>=|<|>|=)?v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)*$/
          const HYPHEN_RANGE_PATTERN = /^v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?\\s+-\\s+v?\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/
          const ADVISORY_ID_PATTERN ="""
          if 'const DIRECT_SELECTOR_PATTERN' not in text:
              if old_constants not in text:
                  raise RuntimeError('Dependency selector constants marker is missing')
              text = text.replace(old_constants, new_constants, 1)

          text = text.replace(
              "const INTEGRITY_PATTERN = /^sha(?:1|256|384|512)-[A-Za-z0-9+/=]+$/",
              "const INTEGRITY_PATTERN = /^sha(?:256|384|512)-[A-Za-z0-9+/=]+$/",
              1,
          )

          trusted_marker = "const REGISTRY_PREFIX = 'https://registry.npmjs.org/'\n"
          trusted_block = """const REGISTRY_PREFIX = 'https://registry.npmjs.org/'
          const TRUSTED_GITHUB_ACTIONS = new Set([
            'actions/checkout',
            'actions/setup-node',
            'actions/upload-artifact',
          ])
          """
          if 'const TRUSTED_GITHUB_ACTIONS' not in text:
              if trusted_marker not in text:
                  raise RuntimeError('Trusted action insertion marker is missing')
              text = text.replace(trusted_marker, trusted_block, 1)

          selector_start = text.find('const selectorSource = (selector) => {')
          selector_end = text.find('\n\nconst readProject = async', selector_start)
          if selector_start == -1 or selector_end == -1:
              raise RuntimeError('Dependency selector function boundaries are missing')
          selector_block = r'''const isSemverSelector = (value) => String(value)
            .split(/\s*\|\|\s*/)
            .every((branch) => (
              DIRECT_SELECTOR_PATTERN.test(branch)
              || COMPARATOR_SET_PATTERN.test(branch)
              || HYPHEN_RANGE_PATTERN.test(branch)
            ))

          const selectorSource = (selector) => {
            const value = String(selector ?? '').trim()
            if (/^(?:git\+|git:|git@|github:)/i.test(value)) return 'git'
            if (/^(?:file:|link:)/i.test(value)) return 'local'
            if (/^http:\/\//i.test(value)) return 'insecure-http'
            if (/^https:\/\//i.test(value)) return 'remote'
            if (isSemverSelector(value)) return 'semver'
            if (
              value === '*'
              || /(?:^|\.)(?:x|\*)$/i.test(value)
              || /^[A-Za-z][A-Za-z0-9._-]*$/.test(value)
            ) return 'mutable-tag'
            return 'unsupported'
          }'''
          text = text[:selector_start] + selector_block + text[selector_end:]

          workflow_start = text.find('const scanWorkflows = async (root) => {')
          workflow_end = text.find('\n\nconst parseDependabot = async (root) => {', workflow_start)
          if workflow_start == -1 or workflow_end == -1:
              raise RuntimeError('Workflow scanner boundaries are missing')
          workflow_block = r'''const readQuotedYamlScalar = (source, start) => {
            const quote = source[start]
            let value = ''
            for (let index = start + 1; index < source.length; index += 1) {
              const character = source[index]
              if (quote === '"' && character === '\\' && index + 1 < source.length) {
                value += source[index + 1]
                index += 1
                continue
              }
              if (character === quote) {
                if (quote === "'" && source[index + 1] === "'") {
                  value += "'"
                  index += 1
                  continue
                }
                return { value, end: index + 1 }
              }
              value += character
            }
            return { value, end: source.length }
          }

          const extractWorkflowUses = (line) => {
            const references = []
            let index = 0
            while (index < line.length) {
              const character = line[index]
              if (character === '#') break

              const keyStart = index
              let keyEnd = index
              if (character === '"' || character === "'") {
                const parsed = readQuotedYamlScalar(line, index)
                if (parsed.value !== 'uses') {
                  index = parsed.end
                  continue
                }
                keyEnd = parsed.end
              } else if (line.slice(index, index + 4) === 'uses') {
                const before = line[index - 1] ?? ''
                const after = line[index + 4] ?? ''
                if (/[A-Za-z0-9_-]/.test(before) || /[A-Za-z0-9_-]/.test(after)) {
                  index += 4
                  continue
                }
                keyEnd = index + 4
              } else {
                index += 1
                continue
              }

              let prefix = keyStart - 1
              while (prefix >= 0 && /\s/.test(line[prefix])) prefix -= 1
              if (prefix >= 0 && !['-', '{', ','].includes(line[prefix])) {
                index = keyEnd
                continue
              }

              let cursor = keyEnd
              while (cursor < line.length && /\s/.test(line[cursor])) cursor += 1
              if (line[cursor] !== ':') {
                index = keyEnd
                continue
              }
              cursor += 1
              while (cursor < line.length && /\s/.test(line[cursor])) cursor += 1

              let value = ''
              let end = cursor
              if (line[cursor] === '"' || line[cursor] === "'") {
                const parsed = readQuotedYamlScalar(line, cursor)
                value = parsed.value
                end = parsed.end
              } else {
                while (end < line.length && !/[\s,}#]/.test(line[end])) end += 1
                value = line.slice(cursor, end)
              }
              if (value) references.push(value)
              index = Math.max(end, keyEnd)
            }
            return references
          }

          const scanWorkflows = async (root) => {
            const workflowFiles = (await listFilesRecursively(root, WORKFLOWS_PATH))
              .filter((file) => /\.ya?ml$/i.test(file))
              .sort()
            const remoteActions = []
            const violations = []

            for (const workflowPath of workflowFiles) {
              const workflowText = await readFile(path.join(root, workflowPath), 'utf8')
              for (const [lineIndex, lineText] of workflowText.split('\n').entries()) {
                for (const reference of extractWorkflowUses(lineText)) {
                  const line = lineIndex + 1
                  if (reference.startsWith('./')) continue
                  if (reference.startsWith('docker://')) {
                    const pinned = /@sha256:[a-f0-9]{64}$/i.test(reference)
                    const trusted = false
                    remoteActions.push({ workflowPath, line, action: reference, ref: null, pinned, trusted, type: 'docker' })
                    if (!pinned) {
                      violations.push(violation('workflow-action-mutable-ref', `Docker action ${reference} is not pinned by digest.`, {
                        path: workflowPath,
                      }))
                    }
                    violations.push(violation('workflow-action-untrusted', `Docker action ${reference} is not present in the reviewed action allowlist.`, {
                      path: workflowPath,
                    }))
                    continue
                  }
                  const parsed = REMOTE_ACTION_PATTERN.exec(reference)
                  const action = parsed?.[1] ?? reference
                  const actionRef = parsed?.[2] ?? ''
                  const pinned = FULL_SHA_PATTERN.test(actionRef)
                  const trusted = TRUSTED_GITHUB_ACTIONS.has(action)
                  remoteActions.push({ workflowPath, line, action, ref: actionRef, pinned, trusted, type: 'github' })
                  if (!pinned) {
                    violations.push(violation('workflow-action-mutable-ref', `Remote action ${reference} is not pinned to a full commit SHA.`, {
                      path: workflowPath,
                    }))
                  }
                  if (!trusted) {
                    violations.push(violation('workflow-action-untrusted', `Remote action ${action} is not present in the reviewed action allowlist.`, {
                      path: workflowPath,
                    }))
                  }
                }
              }
            }

            remoteActions.sort((left, right) => `${left.workflowPath}:${left.line}:${left.action}`.localeCompare(`${right.workflowPath}:${right.line}:${right.action}`))
            return { workflowFiles, remoteActions, violations }
          }'''
          text = text[:workflow_start] + workflow_block + text[workflow_end:]

          dependabot_start = text.find('const parseDependabot = async (root) => {')
          dependabot_end = text.find('\n\nconst serializeExceptions =', dependabot_start)
          if dependabot_start == -1 or dependabot_end == -1:
              raise RuntimeError('Dependabot parser boundaries are missing')
          dependabot_block = r'''const parseYamlScalar = (raw) => {
            const value = String(raw ?? '').trim()
            if (value.startsWith('"') || value.startsWith("'")) {
              return readQuotedYamlScalar(value, 0).value
            }
            return value.replace(/\s+#.*$/, '').trim()
          }

          const parseDependabot = async (root) => {
            const absolute = path.join(root, DEPENDABOT_PATH)
            const required = [
              { ecosystem: 'npm', directory: '/Backend/Chatify' },
              { ecosystem: 'npm', directory: '/Frontend/Chatify' },
              { ecosystem: 'github-actions', directory: '/' },
            ]
            if (!await exists(absolute)) {
              return {
                path: DEPENDABOT_PATH,
                version: null,
                entries: [],
                required,
                missing: required,
                complete: false,
                violations: [violation('dependabot-coverage-missing', 'Dependabot configuration is missing.', { path: DEPENDABOT_PATH })],
              }
            }

            const lines = (await readFile(absolute, 'utf8')).split('\n')
            const entries = []
            let version = null
            let inUpdates = false
            let current = null
            let inSchedule = false
            const commitCurrent = () => {
              if (current) entries.push(current)
              current = null
              inSchedule = false
            }

            for (const line of lines) {
              if (!line.trim() || line.trimStart().startsWith('#')) continue
              const indent = line.match(/^ */)?.[0].length ?? 0
              const trimmed = line.trim()

              if (indent === 0) {
                commitCurrent()
                const versionMatch = /^version\s*:\s*(.+)$/.exec(trimmed)
                if (versionMatch) version = parseYamlScalar(versionMatch[1])
                inUpdates = /^updates\s*:\s*$/.test(trimmed)
                continue
              }
              if (!inUpdates) continue

              if (indent === 2) {
                commitCurrent()
                const ecosystemMatch = /^-\s*package-ecosystem\s*:\s*(.+)$/.exec(trimmed)
                if (ecosystemMatch) {
                  current = {
                    ecosystem: parseYamlScalar(ecosystemMatch[1]),
                    directory: null,
                    scheduleInterval: null,
                    cronjob: null,
                  }
                }
                continue
              }
              if (!current) continue

              if (indent === 4) {
                inSchedule = /^schedule\s*:\s*$/.test(trimmed)
                const directoryMatch = /^directory\s*:\s*(.+)$/.exec(trimmed)
                if (directoryMatch) current.directory = parseYamlScalar(directoryMatch[1])
                continue
              }
              if (indent === 6 && inSchedule) {
                const intervalMatch = /^interval\s*:\s*(.+)$/.exec(trimmed)
                if (intervalMatch) current.scheduleInterval = parseYamlScalar(intervalMatch[1])
                const cronMatch = /^cronjob\s*:\s*(.+)$/.exec(trimmed)
                if (cronMatch) current.cronjob = parseYamlScalar(cronMatch[1])
              }
            }
            commitCurrent()

            entries.sort((left, right) => `${left.ecosystem}:${left.directory}`.localeCompare(`${right.ecosystem}:${right.directory}`))
            const validIntervals = new Set(['daily', 'weekly', 'monthly', 'quarterly', 'semiannually', 'yearly', 'cron'])
            const scheduled = (entry) => (
              validIntervals.has(entry.scheduleInterval)
              && (entry.scheduleInterval !== 'cron' || Boolean(entry.cronjob))
            )
            const missing = required.filter((item) => !entries.some((entry) => (
              entry.ecosystem === item.ecosystem
              && entry.directory === item.directory
              && scheduled(entry)
            )))
            const violations = []
            if (version !== '2') {
              violations.push(violation('dependabot-version-invalid', 'Dependabot configuration must use version 2.', {
                path: DEPENDABOT_PATH,
              }))
            }
            if (missing.length > 0) {
              violations.push(violation('dependabot-coverage-missing', `Dependabot is missing scheduled coverage for ${missing.map((item) => `${item.ecosystem}:${item.directory}`).join(', ')}.`, {
                path: DEPENDABOT_PATH,
              }))
            }
            return {
              path: DEPENDABOT_PATH,
              version,
              entries,
              required,
              missing,
              complete: version === '2' && missing.length === 0,
              violations,
            }
          }'''
          text = text[:dependabot_start] + dependabot_block + text[dependabot_end:]

          text = text.replace(
              "    remoteActionsPinned: !hasCodes('workflow-action-mutable-ref'),\n",
              "    remoteActionsPinned: !hasCodes('workflow-action-mutable-ref'),\n    remoteActionsTrusted: !hasCodes('workflow-action-untrusted'),\n",
              1,
          )
          text = text.replace(
              "    dependabot: {\n      path: dependabot.path,\n",
              "    dependabot: {\n      path: dependabot.path,\n      version: dependabot.version,\n",
              1,
          )
          text = text.replace(
              "? markdownTable(['Workflow', 'Line', 'Action', 'Reference', 'Pinned'], report.workflows.remoteActions.map((item) => [\n",
              "? markdownTable(['Workflow', 'Line', 'Action', 'Reference', 'Pinned', 'Trusted'], report.workflows.remoteActions.map((item) => [\n",
              1,
          )
          text = text.replace(
              "        item.pinned,\n      ]))\n",
              "        item.pinned,\n        item.trusted,\n      ]))\n",
              1,
          )
          text = text.replace(
              "markdownTable(['Ecosystem', 'Directory'], report.dependabot.entries.map((item) => [item.ecosystem, item.directory])),\n",
              "markdownTable(['Ecosystem', 'Directory', 'Schedule'], report.dependabot.entries.map((item) => [item.ecosystem, item.directory, item.scheduleInterval])),\n",
              1,
          )

          policy.write_text(text)
          PY

          node --check scripts/security/lib/live-supply-chain.mjs
          node --check scripts/security/lib/dependency-policy.mjs

      - name: Remove temporary finalizer from permanent tree
        run: git rm -- .github/workflows/security-phase-4-finalizer-clean-hardening.yml

      - name: Verify focused regressions and deterministic evidence
        run: |
          npm run security:phase4:test

          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

      - name: Run complete Phase 4 clean reproduction
        run: npm run security:phase4:reproduce

      - name: Commit verified final hardening
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected clean Phase 4 hardening changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): complete Phase 4 supply-chain hardening'
          git fetch origin security/phase-4-supply-chain-final
          git rebase origin/security/phase-4-supply-chain-final
          git push origin HEAD:security/phase-4-supply-chain-final
