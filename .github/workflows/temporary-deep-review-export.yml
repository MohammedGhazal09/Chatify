name: Temporary deep-review workspace export

on:
  push:
    branches:
      - audit/review-again-20260824
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-deep-review-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout complete audited history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend/Chatify
        run: npm ci

      - name: Install frontend dependencies
        working-directory: Frontend/Chatify
        run: npm ci

      - name: Materialize MongoDB test binary
        working-directory: Backend/Chatify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { MongoMemoryServer } from 'mongodb-memory-server';
          const server = await MongoMemoryServer.create();
          console.log(server.getUri());
          await server.stop();
          NODE

      - name: Package immutable workspace and history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chatify-deep-review"
          git rev-parse HEAD > "$RUNNER_TEMP/chatify-deep-review/AUDITED_HEAD.txt"
          git status --porcelain=v1 > "$RUNNER_TEMP/chatify-deep-review/GIT_STATUS.txt"
          git bundle create "$RUNNER_TEMP/chatify-deep-review/repository.bundle" --all
          MONGOD_PATH="$(find "$HOME" "$GITHUB_WORKSPACE" -type f -name 'mongod*' -perm -u+x | head -1)"
          test -n "$MONGOD_PATH"
          cp "$MONGOD_PATH" "$RUNNER_TEMP/chatify-deep-review/mongod"
          tar --exclude=.git -czf "$RUNNER_TEMP/chatify-deep-review/source-with-dependencies.tgz" .

      - name: Upload deep-review workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatify-deep-review-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/chatify-deep-review/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
