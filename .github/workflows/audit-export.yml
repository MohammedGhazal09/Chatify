name: Temporary frontend lockfile refresh

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-frontend-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
      - name: Refresh patched frontend lockfile
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > Frontend/Chatify/package.json
          cd Frontend/Chatify
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low --json > ../../frontend-audit.json
          mkdir -p ../../frontend-lockfile/Frontend/Chatify
          cp package.json package-lock.json ../../frontend-lockfile/Frontend/Chatify/
          cp ../../frontend-audit.json ../../frontend-lockfile/
      - name: Upload patched frontend lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatify-frontend-lockfile-override
          path: frontend-lockfile/
          if-no-files-found: error
          retention-days: 1
