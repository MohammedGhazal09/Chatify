name: Security Phase 13 Socket Authentication and Authorization

on:
  push:
    branches:
      - security/phase-13-socket-auth-authorization
  pull_request:
    branches:
      - security/phase-12-integrations-notifications
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-13-socket-auth-authorization:
    name: Socket authentication, revocation, authorization, and availability
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Install controlled dependencies
        run: npm --prefix Backend/Chatify ci --strict-allow-scripts

      - name: Check Phase 13 source syntax
        run: |
          node --check Backend/Chatify/Config/socket.mjs
          node --check Backend/Chatify/Controller/authController.mjs
          node --check Backend/Chatify/Utils/tokenCookieGenerator.mjs
          node --check Backend/Chatify/Utils/authToken.mjs
          node --check Backend/Chatify/Utils/sessionMetadata.mjs

      - name: Run Phase 13 and adjacent regressions
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/security/phase13-socket-session-lifecycle.test.mjs \
            test/socket \
            test/auth/session.management.test.mjs \
            test/auth/reset.security.test.mjs

      - name: Audit production dependencies
        run: npm --prefix Backend/Chatify audit --omit=dev --audit-level=high

      - name: Verify patch hygiene
        run: git diff --check HEAD^ HEAD
