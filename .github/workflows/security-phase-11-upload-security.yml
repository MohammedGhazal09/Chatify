name: Security Phase 11 Uploads and Attachments

on:
  push:
    branches:
      - security/phase-11-upload-attachments
  pull_request:
    branches:
      - security/phase-10-mongodb-data-integrity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-11-upload-security:
    name: Upload validation, delivery, quotas, and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Install controlled dependencies
        run: |
          npm --prefix Backend/Chatify ci --strict-allow-scripts
          npm --prefix Frontend/Chatify ci --strict-allow-scripts

      - name: Check changed source syntax
        run: |
          node --check Backend/Chatify/Controller/chatDeletionController.mjs
          node --check Backend/Chatify/Models/uploadBudgetModel.mjs
          node --check Backend/Chatify/Services/uploadBudgetService.mjs
          node --check Backend/Chatify/Services/uploadLifecycleService.mjs
          node --check Backend/Chatify/Middlewares/secureUpload.mjs
          node --check Backend/Chatify/Middlewares/uploadDeliverySecurity.mjs
          node --check Backend/Chatify/Utils/uploadContentSecurity.mjs
          node --check Backend/Chatify/Utils/officeDocumentSecurity.mjs
          node --check Backend/Chatify/Utils/attachmentValidation.mjs
          node --check Backend/Chatify/Utils/profileImageValidation.mjs

      - name: Run Phase 11 and adjacent backend regressions
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/security/phase11-upload-security.test.mjs \
            test/security/phase11-office-container-security.test.mjs \
            test/security/phase11-chat-deletion-lifecycle.test.mjs \
            test/security/phase10-database-security.test.mjs \
            test/message/message.attachments.test.mjs \
            test/message/message.attachment-authorization.test.mjs \
            test/message/message.voice.test.mjs \
            test/user/user.profile-image.test.mjs

      - name: Run protected browser upload rendering regressions
        run: |
          npm --prefix Frontend/Chatify test -- --run \
            src/pages/chat/components/AttachmentPreviewModal.test.tsx \
            src/pages/chat/components/UserAvatar.test.tsx

      - name: Audit production dependencies
        run: |
          npm --prefix Backend/Chatify audit --omit=dev --audit-level=high
          npm --prefix Frontend/Chatify audit --omit=dev --audit-level=high

      - name: Verify patch hygiene
        run: git diff --check HEAD^ HEAD
