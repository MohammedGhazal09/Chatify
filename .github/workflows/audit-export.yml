name: Temporary dependency lockfile refresh

on:
  push:
    branches:
      - security/audit-plan-20260824
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-dependency-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"

      - name: Restore exact cumulative manifests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > Backend/Chatify/package.json
          printf '%s' '' | base64 --decode > Frontend/Chatify/package.json
          node -e "for (const path of ['Backend/Chatify/package.json','Frontend/Chatify/package.json']) JSON.parse(require('node:fs').readFileSync(path,'utf8'))"
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Refresh backend lockfile
        working-directory: Backend/Chatify
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Refresh frontend lockfile
        working-directory: Frontend/Chatify
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Capture dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-results/Backend/Chatify dependency-results/Frontend/Chatify
          cp Backend/Chatify/package.json Backend/Chatify/package-lock.json dependency-results/Backend/Chatify/
          cp Frontend/Chatify/package.json Frontend/Chatify/package-lock.json dependency-results/Frontend/Chatify/
          set +e
          (cd Backend/Chatify && npm audit --omit=dev --audit-level=high --json) > dependency-results/backend-production-audit.json
          backend_production=$?
          (cd Frontend/Chatify && npm audit --omit=dev --audit-level=high --json) > dependency-results/frontend-production-audit.json
          frontend_production=$?
          (cd Backend/Chatify && npm audit --json) > dependency-results/backend-full-audit.json
          backend_full=$?
          (cd Frontend/Chatify && npm audit --json) > dependency-results/frontend-full-audit.json
          frontend_full=$?
          set -e
          printf '%s\n' "$backend_production" > dependency-results/backend-production-audit-exit.txt
          printf '%s\n' "$frontend_production" > dependency-results/frontend-production-audit-exit.txt
          printf '%s\n' "$backend_full" > dependency-results/backend-full-audit-exit.txt
          printf '%s\n' "$frontend_full" > dependency-results/frontend-full-audit-exit.txt
          npm --prefix Backend/Chatify ls --all --json > dependency-results/backend-tree.json
          npm --prefix Frontend/Chatify ls --all --json > dependency-results/frontend-tree.json

      - name: Upload refreshed lockfiles and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatify-refreshed-lockfiles
          path: dependency-results/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Enforce production dependency gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dependency-results/backend-production-audit-exit.txt)" -eq 0
          test "$(cat dependency-results/frontend-production-audit-exit.txt)" -eq 0
