name: Temporary Phase 3 detector calibration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-detector-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-3-secret-exposure
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all available repository refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Apply reviewed detector calibration and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Expected patch marker missing from {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1))

          detectors = 'scripts/security/lib/secret-detectors.mjs'
          replace_once(
              detectors,
              "export const SECRET_NAME_PATTERN = /(?:^|[_-])(?:api[_-]?key|secret|token|password|passwd|pwd|private[_-]?key|client[_-]?secret|credential|auth)(?:$|[_-])/i\n",
              "export const SECRET_NAME_PATTERN = /(?:^|[_-])(?:api[_-]?key|secret|token|password|passwd|pwd|private[_-]?key|client[_-]?secret|credential|signing[_-]?key|encryption[_-]?key)(?:$|[_-])/i\nconst NON_SECRET_METADATA_NAME_PATTERN = /(?:^|[_-])(?:event|prefix|suffix|label|name|path|url|uri|expires?|expiry|ttl|timeout|duration|window|mode|type|id|count|enabled)(?:$|[_-])/i\nconst TEST_OR_DOC_PATH_PATTERN = /(?:^|\\/)(?:test|tests|__tests__|e2e|docs|\\.planning|\\.agents)(?:\\/|$)|\\.(?:test|spec)\\.[cm]?[jt]sx?$/i\nconst SYNTHETIC_FIXTURE_VALUE_PATTERN = /(?:^|[-_:./])(?:example|sample|dummy|fake|fixture|mock|placeholder|material|marker|phase\\d+)(?:[-_:./]|$)/i\n",
          )
          replace_once(
              detectors,
              "  /^\\[[^\\]]*redacted[^\\]]*\\]$/i,\n",
              "  /^\\[[^\\]]*(?:real|smoke|deployed|your|example|sample|placeholder|redacted|replace|account|password|email|url)[^\\]]*\\]$/i,\n",
          )
          replace_once(
              detectors,
              "export const isSecretMaterialName = (name) => SECRET_NAME_PATTERN.test(String(name ?? ''))\n",
              "export const isSecretMaterialName = (name) => {\n  const normalized = String(name ?? '')\n  return SECRET_NAME_PATTERN.test(normalized) && !NON_SECRET_METADATA_NAME_PATTERN.test(normalized)\n}\n",
          )
          replace_once(
              detectors,
              "const specificMatches = ({ text, filePath, scope }) => {\n",
              "const isSyntheticFixtureValue = ({ value, filePath }) => {\n  if (!TEST_OR_DOC_PATH_PATTERN.test(filePath)) return false\n  const normalized = normalize(value)\n  return (\n    SYNTHETIC_FIXTURE_VALUE_PATTERN.test(normalized)\n    || /abcdefghijklmnopqrstuvwxyz/i.test(normalized)\n    || /^A{20,}={0,2}$/.test(normalized)\n  )\n}\n\nconst shouldIgnoreMediumConfidenceFixture = ({ detector, value, filePath }) => (\n  detector.confidence !== 'high' && isSyntheticFixtureValue({ value, filePath })\n)\n\nconst specificMatches = ({ text, filePath, scope }) => {\n",
          )
          replace_once(
              detectors,
              "      if (!value || isPlaceholderValue(value) || (detector.validate && !detector.validate(value))) continue\n",
              "      if (\n        !value\n        || isPlaceholderValue(value)\n        || shouldIgnoreMediumConfidenceFixture({ detector, value, filePath })\n        || (detector.validate && !detector.validate(value))\n      ) continue\n",
          )
          replace_once(
              detectors,
              "    if (!SECRET_NAME_PATTERN.test(name) || isPlaceholderValue(value) || occupied.some((item) => overlaps(item, span))) continue\n",
              "    if (\n      !isSecretMaterialName(name)\n      || isPlaceholderValue(value)\n      || isSyntheticFixtureValue({ value, filePath })\n      || occupied.some((item) => overlaps(item, span))\n    ) continue\n",
          )

          tests = 'scripts/security/__tests__/phase3-secret-scan.test.mjs'
          replace_once(tests, "  isPlaceholderValue,\n", "  isPlaceholderValue,\n  isSecretMaterialName,\n")
          replace_once(
              tests,
              "test('current-tree scan detects credential classes without retaining raw values', async () => {\n",
              "test('detectors reject descriptive placeholders and synthetic fixtures without hiding realistic generic secrets', () => {\n  assert.equal(isPlaceholderValue('[real smoke account A password]'), true)\n  assert.equal(isPlaceholderValue('[deployed frontend URL]'), true)\n  assert.equal(isSecretMaterialName('SECRET_JWT_KEY'), true)\n  assert.equal(isSecretMaterialName('ACCESS_TOKEN_EXPIRES_IN'), false)\n  assert.equal(isSecretMaterialName('AUTH_EXPIRED_EVENT'), false)\n  assert.equal(isSecretMaterialName('CONVERSATION_SECRET_PREFIX'), false)\n\n  const syntheticCases = [\n    {\n      filePath: '.planning/phases/10/USER-SETUP.md',\n      text: \"$env:CHATIFY_SMOKE_USER_A_PASSWORD='[real smoke account A password]'\",\n    },\n    {\n      filePath: 'Backend/Chatify/test/moderation/report.test.mjs',\n      text: \"const text = 'Bearer abcdefghijklmnopqrstuvwxyz1234567890'\",\n    },\n    {\n      filePath: 'Backend/Chatify/test/notification/push.test.mjs',\n      text: \"const subscription = { auth: 'auth-secret-material' }\",\n    },\n    {\n      filePath: 'Frontend/Chatify/e2e/encrypted.spec.ts',\n      text: \"const LOCAL_SECRET_KEY = 'chatify:e2ee:v1:conversation-secret:phase52-chat'\",\n    },\n    {\n      filePath: 'Frontend/Chatify/src/api/axios.ts',\n      text: \"const AUTH_EXPIRED_EVENT = 'chatify:auth-expired'\",\n    },\n    {\n      filePath: 'Frontend/Chatify/src/utils/encryptedMessages.ts',\n      text: \"const CONVERSATION_SECRET_PREFIX = 'chatify:e2ee:v1:conversation-secret:'\",\n    },\n  ]\n\n  for (const fixture of syntheticCases) {\n    assert.deepEqual(scanTextForSecrets({ ...fixture, scope: 'current-tree' }), [])\n  }\n\n  const realistic = scanTextForSecrets({\n    text: \"const SERVICE_API_TOKEN = 'rV8pL2qN7wX4mK9cD6sJ3hF5zB1uY0aT'\",\n    filePath: 'Backend/Chatify/test/provider.test.mjs',\n    scope: 'current-tree',\n  })\n  assert.equal(realistic.length, 1)\n  assert.equal(realistic[0].detectorId, 'generic-secret-assignment')\n})\n\ntest('current-tree scan detects credential classes without retaining raw values', async () => {\n",
          )
          replace_once(
              tests,
              "  await writeFile(path.join(root, 'Backend/Chatify/config.mjs'), \"const secret = process.env.SECRET_JWT_KEY || 'development-secret'\\n\")\n",
              "  await writeFile(path.join(root, 'Backend/Chatify/config.mjs'), [\n    \"const secret = process.env.SECRET_JWT_KEY || 'development-secret'\",\n    \"const accessTokenLifetime = process.env.ACCESS_TOKEN_EXPIRES_IN || '15m'\",\n  ].join('\\n'))\n",
          )
          replace_once(
              tests,
              "  assert.match(renderSecretScanMarkdown(report), /Phase 3 Secret and Credential Exposure/)\n})\n",
              "  const markdown = renderSecretScanMarkdown(report)\n  assert.match(markdown, /Phase 3 Secret and Credential Exposure/)\n  assert.equal(markdown.endsWith('\\n'), false)\n  assert.equal((await readFile(path.join(root, 'docs/security/audit/phase-3/secret-scan.md'), 'utf8')).endsWith('\\n\\n'), false)\n})\n",
          )

          scan = 'scripts/security/lib/secret-scan.mjs'
          replace_once(
              scan,
              "    'Candidates require provider-side ownership verification and rotation. The scanner does not replay credentials or make provider API calls.',\n    '',\n  ]\n",
              "    'Candidates require provider-side ownership verification and rotation. The scanner does not replay credentials or make provider API calls.',\n  ]\n",
          )
          PY

      - name: Verify calibration and regenerate all deterministic evidence
        id: phase3
        run: |
          git rm --cached -- .github/workflows/security-phase-3-materialize.yml

          node --check scripts/security/lib/secret-detectors.mjs
          node --check scripts/security/lib/secret-scan.mjs
          npm run security:phase3:test
          node --test Backend/Chatify/test/security/secret-configuration.test.mjs

          set +e
          npm run security:phase3:generate
          generate_status=$?
          set -e

          git add \
            docs/security/audit/phase-3/secret-scan.json \
            docs/security/audit/phase-3/secret-scan.md
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:generate
          npm run security:phase2:check

          set +e
          npm run security:phase3:check
          check_status=$?
          set -e

          git restore --staged -- .github/workflows/security-phase-3-materialize.yml
          echo "generate_status=$generate_status" >> "$GITHUB_OUTPUT"
          echo "check_status=$check_status" >> "$GITHUB_OUTPUT"

      - name: Commit calibrated detectors and sanitized evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected detector calibration changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): calibrate Phase 3 secret detectors'
          git fetch origin security/phase-3-secret-exposure
          git rebase origin/security/phase-3-secret-exposure
          git push origin HEAD:security/phase-3-secret-exposure

      - name: Enforce calibrated Phase 3 gate
        if: steps.phase3.outputs.generate_status != '0' || steps.phase3.outputs.check_status != '0'
        run: |
          echo 'Calibrated evidence was committed, but the Phase 3 gate remains red. Review the sanitized report.' >&2
          exit 1
