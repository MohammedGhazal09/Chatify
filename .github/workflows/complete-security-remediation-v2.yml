name: Complete security remediation v2

on:
  push:
    branches:
      - security/audit-plan-20260824
    paths:
      - .audit/complete-security-remediation-v2-20260826.txt

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: comprehensive-security-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate-verify-protect-and-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/audit-plan-20260824
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@1e60f620b9541dca151540d0c3c4822f3d78ff
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Apply every source remediation idempotently
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            .audit/remediate-security-remaining-20260825.mjs \
            .audit/remediate-security-compatibility-20260826.mjs \
            .audit/remediate-security-atomic-core-20260826.mjs \
            .audit/remediate-security-atomic-core-fix-20260826.mjs
          do
            if [ -f "$script" ]; then node "$script"; fi
          done

      - name: Refresh root dependency graph safely
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci

      - name: Refresh backend dependency graph safely
        working-directory: Backend/Chatify
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci

      - name: Refresh frontend dependency graph on the validated toolchain
        working-directory: Frontend/Chatify
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.devDependencies ??= {}
          pkg.devDependencies.vite = '^8.2.1'
          pkg.devDependencies['@vitejs/plugin-react'] = '^6.1.0'
          pkg.engines = { node: '>=24.19.0 <25', npm: '>=11.17.0 <12' }
          pkg.packageManager = 'npm@11.17.0'
          pkg.allowScripts = { ...(pkg.allowScripts ?? {}), '@tailwindcss/oxide@4.1.11': true, fsevents: false }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci

      - name: Verify backend
        working-directory: Backend/Chatify
        run: |
          npm test -- --run
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Verify frontend
        working-directory: Frontend/Chatify
        run: |
          npm test -- --run
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Verify repository security and operations gates
        run: |
          npm run ops:check
          npm run security:phase5:reproduce
          npm run security:log-assert

      - name: Commit the fully verified branch state
        shell: bash
        run: |
          rm -f \
            .audit/complete-security-remediation-v2-20260826.txt \
            .audit/complete-security-remediation-20260826.txt \
            .audit/finalize-security-remediation-20260826.txt \
            .audit/security-dependency-closure-20260826.txt \
            .audit/remediate-security-remaining-20260825.mjs \
            .audit/remediate-security-compatibility-20260826.mjs \
            .audit/remediate-security-atomic-core-20260826.mjs \
            .audit/remediate-security-atomic-core-fix-20260826.mjs \
            .github/workflows/apply-security-dependency-closure.yml \
            .github/workflows/apply-comprehensive-security-remediation.yml \
            .github/workflows/apply-comprehensive-security-remediation-v2.yml \
            .github/workflows/finalize-security-remediation.yml \
            .github/workflows/complete-security-remediation.yml \
            .github/workflows/complete-security-remediation-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): complete and verify repository-wide audit remediation"
            git push origin HEAD:security/audit-plan-20260824
          fi

      - name: Apply strict main-branch protection
        env:
          GH_TOKEN: ${{ secrets.CHATIFY_ADMIN_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/branch-protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "Required quality gate",
                "Dependency audit",
                "Authentication and session"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismissal_restrictions": {},
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1,
              "require_last_push_approval": true,
              "bypass_pull_request_allowances": {}
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": true
          }
          JSON
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/branches/main/protection" \
            --input /tmp/branch-protection.json
          test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.enforce_admins.enabled')" = true
          test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.allow_force_pushes.enabled')" = false
          test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.allow_deletions.enabled')" = false
          test "$(gh api "/repos/$GITHUB_REPOSITORY/branches/main/protection" --jq '.required_pull_request_reviews.required_approving_review_count')" -ge 1

      - name: Mark remediation PR ready
        env:
          GH_TOKEN: ${{ secrets.CHATIFY_ADMIN_TOKEN || github.token }}
        run: gh pr ready 21 --repo "$GITHUB_REPOSITORY"
