name: Audit cumulative source export

on:
  pull_request:
  push:
    branches:
      - security/phase-18-privacy-data-lifecycle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cumulative audited revision with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Create source and history archives
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          tar --exclude=.git -czf "${RUNNER_TEMP}/chatify-cumulative-${HEAD_SHA}.tar.gz" .
          git bundle create "${RUNNER_TEMP}/chatify-cumulative-${HEAD_SHA}.bundle" --all
          printf '%s\n' "${HEAD_SHA}" > "${RUNNER_TEMP}/AUDITED_HEAD.txt"

      - name: Upload source and history archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatify-cumulative-history-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/chatify-cumulative-*.tar.gz
            ${{ runner.temp }}/chatify-cumulative-*.bundle
            ${{ runner.temp }}/AUDITED_HEAD.txt
          if-no-files-found: error
          retention-days: 1
