name: Temporary Phase 4 verified workspace export

on:
  push:
    branches:
      - security/phase-4-dependency-supply-chain
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-verified-workspace-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Execute the reviewed materialization run blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/security-phase-4-materialize.yml')
          lines = workflow.read_text().splitlines()
          run_steps = []
          index = 0

          while index < len(lines):
              line = lines[index]
              if not line.startswith('      - name: '):
                  index += 1
                  continue

              name = line.removeprefix('      - name: ')
              cursor = index + 1
              script = None
              while cursor < len(lines) and not lines[cursor].startswith('      - name: '):
                  if lines[cursor] == '        run: |':
                      cursor += 1
                      block = []
                      while cursor < len(lines):
                          current = lines[cursor]
                          if current.startswith('          '):
                              block.append(current[10:])
                              cursor += 1
                              continue
                          if current == '':
                              block.append('')
                              cursor += 1
                              continue
                          break
                      script = '\n'.join(block)
                      break
                  cursor += 1

              if script is not None:
                  run_steps.append((name, script))
              index = max(cursor, index + 1)

          skipped = {'Commit verified Phase 4 implementation and evidence'}
          for name, script in run_steps:
              if name in skipped:
                  continue
              print(f'\n==> {name}', flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', script],
                  check=True,
              )
          PY

      - name: Package only the verified repository workspace
        run: |
          rm -f .github/workflows/security-phase-4-final-export.yml
          git diff --check
          git ls-files --cached --others --exclude-standard -z \
            | tar --null --files-from=- --create --gzip \
                --file /tmp/chatify-phase4-verified-workspace.tar.gz
          sha256sum /tmp/chatify-phase4-verified-workspace.tar.gz

      - name: Upload verified Phase 4 workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-4-verified-workspace
          path: /tmp/chatify-phase4-verified-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
