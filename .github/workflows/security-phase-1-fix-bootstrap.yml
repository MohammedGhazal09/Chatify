name: Temporary Phase 1 inventory repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-1-repository-inventory
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Recover reviewed source patch
        run: |
          python - <<'PYEXTRACT'
          from pathlib import Path
          from subprocess import check_output

          workflow_path = '.github/workflows/security-phase-1-fix-bootstrap.yml'
          previous = check_output([
              'git', 'show',
              f'837c5df44677e99ec8faa020741e2b7da3c712f5:{workflow_path}',
          ], text=True)
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = previous.index(start_marker) + len(start_marker)
          end = previous.index(end_marker, start)
          body = previous[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'

          nested_skip = "      regex.lastIndex = balanced.endIndex + 1\n"
          if body.count(nested_skip) != 2:
              raise RuntimeError(f'Expected socket and service-worker cursor updates, found {body.count(nested_skip)}')
          body = body.replace(nested_skip, '', 1)

          foundation_patch = "\nfoundation = foundation_path.read_text()\n"
          foundation_start = body.find(foundation_patch)
          if foundation_start == -1:
              raise RuntimeError('Foundation workflow patch marker not found')
          body = body[:foundation_start] + '\n'

          Path('/tmp/phase1-hardening.py').write_text(body)
          PYEXTRACT
          python /tmp/phase1-hardening.py

      - name: Remove ordinary bootstrap material
        run: |
          git rm -r --ignore-unmatch scripts/security/phase1-bootstrap-chunks
          git rm -r --ignore-unmatch .planning/quick/260820-phase-1-security-inventory

      - name: Exclude temporary workflow from final inventory
        run: git rm --cached .github/workflows/security-phase-1-fix-bootstrap.yml

      - name: Verify parser hardening
        run: |
          node --check scripts/security/lib/inventory.mjs
          node --check scripts/security/phase1-inventory.mjs
          node --check scripts/security/phase1-doctor.mjs
          node --check scripts/security/phase1-reproduce.mjs
          npm run security:phase1:test
          npm run doctor

      - name: Regenerate deterministic inventory
        run: |
          npm run security:phase1:generate
          npm run security:phase1:check

      - name: Restore temporary workflow to this commit
        run: git add .github/workflows/security-phase-1-fix-bootstrap.yml

      - name: Commit verified Phase 1 implementation
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected verified Phase 1 changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): finalize Phase 1 inventory controls'
          git push origin HEAD:security/phase-1-repository-inventory
