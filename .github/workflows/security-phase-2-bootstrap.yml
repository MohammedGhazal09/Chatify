name: Temporary Phase 2 threat model bootstrap

on:
  push:
    branches:
      - security/phase-2-threat-model
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-2-threat-model
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Ignore generated runtime evidence
        run: |
          if ! grep -qxF '.artifacts/security/' .gitignore; then
            printf '\n# Generated security runtime evidence\n.artifacts/security/\n' >> .gitignore
          fi

      - name: Verify Phase 2 source and regression tests
        run: |
          node --check scripts/security/lib/phase2-policy.mjs
          node --check scripts/security/lib/threat-model.mjs
          node --check scripts/security/phase2-threat-model.mjs
          node --check scripts/security/phase2-reproduce.mjs
          npm run security:phase1:test
          npm run security:phase2:test

      - name: Generate deterministic Phase 2 evidence
        run: |
          npm run security:phase2:generate
          npm run security:phase2:check
          git add .gitignore docs/security/audit/phase-2/threat-model.json docs/security/audit/phase-2/threat-model.md

      - name: Generate Phase 1 inventory over the final tracked source set
        run: |
          git rm --cached .github/workflows/security-phase-2-bootstrap.yml
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:check
          git add .github/workflows/security-phase-2-bootstrap.yml

      - name: Verify environment contract
        run: npm run doctor

      - name: Commit generated Phase 1 and Phase 2 evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected generated Phase 2 evidence was not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(security): generate Phase 2 threat model evidence'
          git push origin HEAD:security/phase-2-threat-model
