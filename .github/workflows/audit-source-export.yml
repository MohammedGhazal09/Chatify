name: Audit Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    name: Export immutable review source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Package source tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/chatify-source.tgz" .

      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatify-audit-source
          path: ${{ runner.temp }}/chatify-source.tgz
          if-no-files-found: error
          retention-days: 1
