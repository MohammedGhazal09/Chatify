name: Security Phase 14 Presence and Metadata Privacy

on:
  push:
    branches:
      - security/phase-14-presence-metadata-privacy
  pull_request:
    branches:
      - security/phase-13-socket-auth-authorization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-14-presence-metadata-privacy:
    name: Presence visibility, typing, and receipt privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Install controlled dependencies
        run: npm --prefix Backend/Chatify ci --strict-allow-scripts

      - name: Check Phase 14 source syntax
        run: |
          node --check Backend/Chatify/Config/socket.mjs
          node --check Backend/Chatify/server.mjs
          node --check Backend/Chatify/Controller/userController.mjs
          node --check Backend/Chatify/Routes/userRouter.mjs
          node --check Backend/Chatify/Utils/presencePrivacy.mjs
          node --check Backend/Chatify/Services/socketPresencePrivacyService.mjs
          node --check Backend/Chatify/Middlewares/presencePrivacy.mjs
          node --check Backend/Chatify/test/helpers/socketServer.mjs

      - name: Run Phase 14 and adjacent regressions
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/security/phase14-presence-metadata-privacy.test.mjs \
            test/socket/socket.presence-reconnect.test.mjs \
            test/socket/socket.authorization.test.mjs \
            test/socket/socket.blocking.test.mjs \
            test/socket/socket.message-state.test.mjs \
            test/socket/socket.voice-identity.test.mjs

      - name: Audit production dependencies
        run: npm --prefix Backend/Chatify audit --omit=dev --audit-level=high

      - name: Verify patch hygiene
        run: git diff --check HEAD^ HEAD
