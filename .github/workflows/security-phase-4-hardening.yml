name: Temporary Phase 4 bundled-parent hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase4-bundled-parent-hardening
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-4-dependency-supply-chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-4-dependency-supply-chain
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Add bundled-parent regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/security/__tests__/phase4-dependency-policy.test.mjs')
          text = path.read_text()

          if "assert.equal(bundled.bundleParentPath, 'node_modules/axios')" not in text:
              marker = "  assert.equal(bundled.integrityInherited, true)\n"
              if marker not in text:
                  raise RuntimeError('Positive bundled-parent assertion marker is missing')
              text = text.replace(
                  marker,
                  marker + "  assert.equal(bundled.bundleParentPath, 'node_modules/axios')\n",
                  1,
              )

          negative = """test('bundled status cannot bypass source and integrity without a verified parent artifact', async () => {
            const root = await createFixture()
            const lockPath = path.join(root, 'Backend/Chatify/package-lock.json')
            const parsed = JSON.parse(await readFile(lockPath, 'utf8'))
            parsed.packages['node_modules/unverified-bundled-helper'] = {
              version: '1.2.3',
              inBundle: true,
            }
            await writeJson(lockPath, parsed)

            const report = await buildDependencyPolicy(root, { now: NOW })
            assert.equal(report.violations.some((item) => (
              item.code === 'dependency-bundle-parent-unverified'
              && item.package === 'unverified-bundled-helper'
            )), true)
            assert.throws(() => assertPhase4ExitGate(report), /dependencySourcesTrusted/)
          })

          """
          if 'bundled status cannot bypass source and integrity' not in text:
              marker = "test('unsafe sources, missing integrity, mutable actions, and missing update coverage fail closed', async () => {"
              if marker not in text:
                  raise RuntimeError('Negative bundled-parent insertion marker is missing')
              text = text.replace(marker, negative + marker, 1)

          path.write_text(text)
          PY

      - name: Prove the regression fails before implementation
        run: |
          set +e
          npm run security:phase4:test
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Bundled-parent regressions unexpectedly passed before implementation.' >&2
            exit 1
          fi

      - name: Require an integrity-verified parent for bundled entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Expected patch marker missing from {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))

          policy = 'scripts/security/lib/dependency-policy.mjs'
          replace_once(
              policy,
              "const selectorSource = (selector) => {",
              "const parentPackageLockPath = (lockPath) => {\n  const marker = '/node_modules/'\n  const index = String(lockPath ?? '').lastIndexOf(marker)\n  return index === -1 ? null : String(lockPath).slice(0, index)\n}\n\nconst verifiedBundleParent = (lockPath, packages) => {\n  let parentPath = parentPackageLockPath(lockPath)\n  while (parentPath) {\n    const parentEntry = packages?.[parentPath]\n    if (!parentEntry) return null\n    const sourceType = classifyDependencySource(parentEntry)\n    if (sourceType === 'bundled') {\n      parentPath = parentPackageLockPath(parentPath)\n      continue\n    }\n    return sourceType === 'npm-registry' && INTEGRITY_PATTERN.test(parentEntry?.integrity ?? '')\n      ? parentPath\n      : null\n  }\n  return null\n}\n\nconst selectorSource = (selector) => {",
          )
          replace_once(
              policy,
              "    const directType = packageName && lockPath === `node_modules/${packageName}` ? directTypes.get(packageName) ?? null : null\n    const record = {",
              "    const directType = packageName && lockPath === `node_modules/${packageName}` ? directTypes.get(packageName) ?? null : null\n    const bundleParentPath = sourceType === 'bundled'\n      ? verifiedBundleParent(lockPath, lockfile.packages ?? {})\n      : null\n    const record = {",
          )
          replace_once(
              policy,
              "      integrityPresent: sourceType === 'bundled' ? null : INTEGRITY_PATTERN.test(entry?.integrity ?? ''),\n      integrityInherited: sourceType === 'bundled',\n",
              "      integrityPresent: sourceType === 'bundled' ? null : INTEGRITY_PATTERN.test(entry?.integrity ?? ''),\n      integrityInherited: sourceType === 'bundled' && Boolean(bundleParentPath),\n      bundleParentPath,\n",
          )
          replace_once(
              policy,
              "    if (entry?.link !== true && sourceType !== 'bundled') {",
              "    if (sourceType === 'bundled' && !bundleParentPath) {\n      violations.push(violation('dependency-bundle-parent-unverified', `Bundled lockfile entry ${lockPath} has no integrity-verified parent artifact.`, {\n        project: project.id,\n        path: project.lockfilePath,\n        package: packageName ?? lockPath,\n      }))\n    }\n\n    if (entry?.link !== true && sourceType !== 'bundled') {",
          )

          documentation_changes = {
              'docs/plans/2026-08-21-phase-4-dependency-and-supply-chain.md': [
                  (
                      '5. Require every independently fetched registry lockfile entry to use an exact version, HTTPS registry resolution, and an integrity value. A lock entry explicitly marked `inBundle`/`bundled` may omit its own source and integrity because npm extracts it from the integrity-verified parent artifact. Reject Git, local file, link, mutable-tag, and remote-tarball dependency sources unless a separately reviewed policy explicitly permits them.',
                      '5. Require every independently fetched registry lockfile entry to use an exact version, HTTPS registry resolution, and an integrity value. A lock entry explicitly marked `inBundle`/`bundled` may omit its own source and integrity only when its nearest independently fetched ancestor is an HTTPS npm-registry artifact with valid SRI metadata. Reject unverified bundle roots, Git, local file, link, mutable-tag, and remote-tarball dependency sources unless a separately reviewed policy explicitly permits them.',
                  ),
                  (
                      '- every independently fetched package-lock registry artifact has an exact version, trusted HTTPS source, and integrity metadata; explicitly bundled children inherit source and integrity from their verified parent artifact;',
                      '- every independently fetched package-lock registry artifact has an exact version, trusted HTTPS source, and integrity metadata; explicitly bundled children inherit source and integrity only through a verified registry parent artifact;',
                  ),
              ],
              'docs/security/audit/phase-4/README.md': [
                  (
                      '- independently fetched registry artifacts without Subresource Integrity metadata; explicitly bundled children inherit source and integrity from their verified parent artifact;',
                      '- independently fetched registry artifacts without Subresource Integrity metadata, and bundled entries without an integrity-verified registry parent artifact;',
                  ),
              ],
              'docs/security/audit/phase-4/dependency-update-procedure.md': [
                  (
                      '- every independently fetched registry package retains an integrity value; explicitly bundled children remain attributable to their integrity-verified parent artifact;',
                      '- every independently fetched registry package retains an integrity value; explicitly bundled children remain attributable to a verified registry parent artifact rather than self-declaring trust;',
                  ),
              ],
              'docs/superpowers/plans/2026-08-21-phase-4-dependency-supply-chain.md': [
                  (
                      "Accept independently fetched registry artifacts only when `resolved` is HTTPS npm-registry content (or npm's registry-relative representation), `integrity` is SRI, and `version` is exact. Treat only entries explicitly marked `inBundle`/`bundled` as inheriting source and integrity from their verified parent artifact. Record and reject Git, local, link, HTTP, mutable tag, and remote-tarball sources.",
                      "Accept independently fetched registry artifacts only when `resolved` is HTTPS npm-registry content (or npm's registry-relative representation), `integrity` is SRI, and `version` is exact. Treat an entry explicitly marked `inBundle`/`bundled` as inherited only when its nearest independently fetched ancestor is an integrity-verified registry artifact. Record and reject unverified bundle roots, Git, local, link, HTTP, mutable tag, and remote-tarball sources.",
                  ),
              ],
          }
          for file_path, replacements in documentation_changes.items():
              for old, new in replacements:
                  replace_once(file_path, old, new)

          allowlist = Path('docs/security/audit/phase-3/secret-scan-allowlist.json')
          allowlist.write_text(json.dumps({
              'schemaVersion': 1,
              'entries': [{
                  'candidateId': 'sec_ba995af4e5dcfc5219be0638',
                  'owner': 'security-audit-maintainers',
                  'reason': 'Synthetic high-entropy regression fixture from Phase 3 development history; it is not a provider credential and has no runtime use.',
                  'expiresAt': '2027-02-21T00:00:00.000Z',
              }],
          }, indent=2) + '\n')
          PY

      - name: Remove temporary workflow from the permanent tree
        run: git rm -- .github/workflows/security-phase-4-hardening.yml

      - name: Verify focused hardening
        run: |
          node --check scripts/security/lib/dependency-policy.mjs
          npm run security:phase4:test
          npm run security:phase3:generate
          npm run security:phase3:check

      - name: Regenerate stable Phase 1 through Phase 4 evidence
        run: |
          npm run security:phase4:generate
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check

      - name: Run complete Phase 4 reproduction
        run: npm run security:phase4:reproduce

      - name: Commit verified hardening and evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected bundled-parent hardening changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): verify bundled dependency parent artifacts'
          git fetch origin security/phase-4-dependency-supply-chain
          git rebase origin/security/phase-4-dependency-supply-chain
          git push origin HEAD:security/phase-4-dependency-supply-chain
