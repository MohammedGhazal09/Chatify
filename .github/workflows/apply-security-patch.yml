name: Temporary security patch application

on:
  push:
    branches:
      - security/audit-plan-20260824
    paths:
      - .audit/pending.patch.gz.b64

permissions:
  contents: write

concurrency:
  group: temporary-security-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: security/audit-plan-20260824

      - name: Apply queued patch and remove transport file
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .audit/pending.patch.gz.b64 | gzip --decompress > /tmp/security.patch
          git apply --index --whitespace=error /tmp/security.patch
          git rm .audit/pending.patch.gz.b64
          git config user.name "Chatify Security Audit"
          git config user.email "security-audit@users.noreply.github.com"
          git commit -m "test(security): reproduce validated audit findings"
          git push origin HEAD:security/audit-plan-20260824
