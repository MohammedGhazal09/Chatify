name: Resolve all findings verification

on:
  push:
    branches:
      - security/resolve-all-findings-20260826
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolve-all-findings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build source archive
        run: tar --exclude=.git -czf /tmp/chatify-review-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatify-review-source
          path: /tmp/chatify-review-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  focused-red-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install backend
        working-directory: Backend/Chatify
        run: npm ci
      - name: Run focused security regressions
        working-directory: Backend/Chatify
        run: |
          npm test -- --run \
            test/auth/reset.concurrent-attempts.test.mjs \
            test/auth/two-factor.concurrent-challenge.test.mjs \
            test/space/space.privilege-boundary.test.mjs \
            test/integration/integration-authority-lifecycle.test.mjs \
            test/privacy/privacy-operations.test.mjs \
            test/notification/notification.delivery.test.mjs \
            test/security/phase11-chat-deletion-lifecycle.test.mjs
