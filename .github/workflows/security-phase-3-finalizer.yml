name: Temporary Phase 3 deterministic finalization

on:
  pull_request:
  push:
    branches:
      - security/phase-3-secret-exposure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-final-security-hardening
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-3-secret-exposure
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch repository history and current PR refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/4/head:refs/remotes/pull/4/head'

          fetched_merge=0
          for attempt in 1 2 3 4 5; do
            if git fetch --force origin \
              '+refs/pull/4/merge:refs/remotes/pull/4/merge'; then
              fetched_merge=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$fetched_merge" = "1"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Remove all temporary Phase 3 material
        run: |
          git rm --ignore-unmatch \
            .github/workflows/security-phase-3-finalizer.yml \
            .github/workflows/security-phase-3-hardening-materialize.yml \
            .github/workflows/security-phase-3-verify-ready.yml \
            scripts/security/phase3-final-hardening/part-00.b64

      - name: Install clean dependency trees
        run: |
          npm --prefix Backend/Chatify ci
          npm --prefix Frontend/Chatify ci

      - name: Run Phase 1 through Phase 3 focused verification
        run: |
          node --check Backend/Chatify/Utils/secretConfiguration.mjs
          node --check scripts/security/lib/secret-detectors.mjs
          node --check scripts/security/lib/secret-scan.mjs
          node --check scripts/security/phase3-secret-scan.mjs
          node --check scripts/security/phase3-reproduce.mjs
          npm run security:phase1:test
          npm run security:phase2:test
          npm run security:phase3:test
          npm --prefix Backend/Chatify test -- --run test/security/secret-configuration.test.mjs
          npm run doctor

      - name: Regenerate deterministic Phase 1 through Phase 3 evidence
        run: |
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check

      - name: Run complete repository quality and operations gates
        run: |
          npm run quality
          npm run ops:check

      - name: Commit permanent Phase 3 tree
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected final Phase 3 cleanup or evidence changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: finalize Phase 3 controls and evidence'
          git push origin HEAD:security/phase-3-secret-exposure
