name: Temporary canonical remediation red-green

on:
  push:
    branches:
      - security/canonical-remediation-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-remediation-red-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: node --test scripts/security/__tests__/phase3-secret-scan.test.mjs

  backend-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Backend/Chatify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json
      - run: npm ci
      - run: >-
          npm test -- --run
          test/security/canonical-remediation-regressions.test.mjs
          test/security/phase6-authorization-access-control.test.mjs

  frontend-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend/Chatify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: Frontend/Chatify/package-lock.json
      - run: npm ci
      - run: npm test -- --run src/security/canonicalDeploymentPolicy.test.ts src/api/apiOrigin.test.ts
