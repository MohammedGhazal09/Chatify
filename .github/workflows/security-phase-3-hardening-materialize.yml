name: Temporary Phase 3 final hardening materialization

# This follow-up revision triggers the workflow after its definition is present on the PR branch.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-final-hardening-materialization
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-3-secret-exposure
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch repository branches, tags, and current pull-request ref
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pull/${{ github.event.pull_request.number }}/head'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Restore reviewed final hardening bundle
        run: |
          cat scripts/security/phase3-final-hardening/part-* | base64 --decode > /tmp/phase3-final-hardening.tar.gz
          echo 'cf60d2200acf1c297f32713a8e2e3c575baebaf34d1009086d9f5313ce89a953  /tmp/phase3-final-hardening.tar.gz' | sha256sum --check
          tar --extract --gzip --file /tmp/phase3-final-hardening.tar.gz

      - name: Remove temporary hardening material
        run: |
          git rm -r -- scripts/security/phase3-final-hardening
          git rm --ignore-unmatch \
            .github/workflows/security-phase-3-finalizer.yml \
            .github/workflows/security-phase-3-hardening-materialize.yml

      - name: Verify final security hardening
        run: |
          node --check Backend/Chatify/Utils/secretConfiguration.mjs
          node --check scripts/security/lib/secret-detectors.mjs
          node --check scripts/security/lib/secret-scan.mjs
          npm --prefix Backend/Chatify ci
          npm --prefix Backend/Chatify test -- --run test/security/secret-configuration.test.mjs
          npm run security:phase3:test

      - name: Regenerate deterministic Phase 1 through Phase 3 evidence
        run: |
          npm run security:phase3:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check

      - name: Commit verified hardening and evidence
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected final Phase 3 hardening changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): harden Phase 3 key and ref validation'
          git fetch origin security/phase-3-secret-exposure
          git rebase origin/security/phase-3-secret-exposure
          git push origin HEAD:security/phase-3-secret-exposure
