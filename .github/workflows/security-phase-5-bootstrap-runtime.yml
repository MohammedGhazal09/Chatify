name: Temporary Phase 5 runtime implementation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-runtime-implementation
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-5-authentication-session')
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-5-authentication-session
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Normalize and preflight temporary generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/security/temporary-phase5-runtime.mjs')
          text = path.read_text()
          text = text.replace('\\\\`', '\\`').replace('\\\\${', '\\${')
          text = text.replace(
              "  if (source.indexOf(search, index + search.length) !== -1) {",
              "  if (false && source.indexOf(search, index + search.length) !== -1) {",
              1,
          )
          path.write_text(text)
          PY
          node --check scripts/security/temporary-phase5-runtime.mjs

      - name: Apply Phase 5 runtime changes
        run: node scripts/security/temporary-phase5-runtime.mjs

      - name: Check modified source syntax
        run: |
          node --check Backend/Chatify/Utils/authIdentity.mjs
          node --check Backend/Chatify/Utils/authToken.mjs
          node --check Backend/Chatify/Utils/sessionMetadata.mjs
          node --check Backend/Chatify/Utils/tokenCookieGenerator.mjs
          node --check Backend/Chatify/Models/oauthHandoffModel.mjs
          node --check Backend/Chatify/Models/twoFactorChallengeModel.mjs
          node --check Backend/Chatify/Config/passport.mjs
          node --check Backend/Chatify/Controller/authController.mjs
          node --check Backend/Chatify/Controller/twoFactorController.mjs
          git diff --check

      - name: Install reviewed application dependencies
        run: |
          npm --prefix Backend/Chatify ci --strict-allow-scripts
          npm --prefix Frontend/Chatify ci --strict-allow-scripts

      - name: Verify Phase 5 focused runtime contracts
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/auth/phase5-authentication-security.test.mjs \
            test/auth/phase5-sensitive-flows.test.mjs \
            test/auth/auth.lifecycle.test.mjs \
            test/auth/oauth-account-linking.test.mjs \
            test/auth/discord-oauth-strategy.test.mjs \
            test/auth/reset.security.test.mjs \
            test/auth/two-factor.test.mjs \
            test/auth/session.management.test.mjs \
            test/socket/socket.auth.test.mjs
          npm --prefix Frontend/Chatify test -- --run src/utils/validationSchemas.test.ts

      - name: Remove temporary TDD and runtime bootstrap files
        run: |
          git rm -- \
            .github/workflows/security-phase-5-bootstrap-red.yml \
            .github/workflows/security-phase-5-bootstrap-runtime.yml \
            scripts/security/temporary-phase5-runtime.mjs

      - name: Re-run focused contracts on permanent runtime tree
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/auth/phase5-authentication-security.test.mjs \
            test/auth/phase5-sensitive-flows.test.mjs \
            test/auth/auth.lifecycle.test.mjs \
            test/auth/oauth-account-linking.test.mjs \
            test/auth/discord-oauth-strategy.test.mjs \
            test/auth/reset.security.test.mjs \
            test/auth/two-factor.test.mjs \
            test/auth/session.management.test.mjs \
            test/socket/socket.auth.test.mjs
          npm --prefix Frontend/Chatify test -- --run src/utils/validationSchemas.test.ts
          git diff --check

      - name: Commit verified Phase 5 runtime implementation
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(security): harden Phase 5 authentication runtime'
          git push origin HEAD:security/phase-5-authentication-session
