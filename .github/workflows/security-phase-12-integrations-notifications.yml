name: Security Phase 12 Integrations and Notifications

on:
  push:
    branches:
      - security/phase-12-integrations-notifications
  pull_request:
    branches:
      - security/phase-11-upload-attachments
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-12-integrations-notifications:
    name: Integration authorization and bounded outbound delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: Backend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Install controlled dependencies
        run: npm --prefix Backend/Chatify ci --strict-allow-scripts

      - name: Check Phase 12 source syntax
        run: |
          node --check Backend/Chatify/Utils/outboundRequestSecurity.mjs
          node --check Backend/Chatify/Utils/notificationPreferences.mjs
          node --check Backend/Chatify/Services/emailService.mjs
          node --check Backend/Chatify/Services/notificationService.mjs
          node --check Backend/Chatify/Middlewares/integrationRuntimeAuth.mjs
          node --check Backend/Chatify/Utils/integrationPermissions.mjs
          node --check Backend/Chatify/Controller/integrationController.mjs

      - name: Run Phase 12 and adjacent regressions
        run: |
          npm --prefix Backend/Chatify test -- --run \
            test/security/phase12-outbound-request-security.test.mjs \
            test/security/phase12-email-delivery-security.test.mjs \
            test/security/phase12-push-delivery-security.test.mjs \
            test/notification/notification.preferences.test.mjs \
            test/notification/notification.outbox.test.mjs \
            test/notification/notification.delivery.test.mjs \
            test/integration/integration-permissions.test.mjs

      - name: Audit production dependencies
        run: npm --prefix Backend/Chatify audit --omit=dev --audit-level=high

      - name: Verify patch hygiene
        run: git diff --check HEAD^ HEAD
