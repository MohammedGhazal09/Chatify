name: Temporary canonical source export

on:
  push:
    branches:
      - security/canonical-remediation-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export canonical source for local verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/chatify-canonical-source.tgz" .

      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatify-canonical-source
          path: ${{ runner.temp }}/chatify-canonical-source.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
