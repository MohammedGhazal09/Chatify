name: Temporary frontend lockfile refresh

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-frontend-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
      - name: Resolve Vite 8 graph and audit it
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > Frontend/Chatify/package.json
          cd Frontend/Chatify
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low --json > ../../frontend-audit.json
          node - <<'NODE'
          const p = require('./package-lock.json')
          if (p.packages['node_modules/vite']?.version !== '8.2.1') throw new Error('Vite 8.2.1 was not resolved')
          if (p.packages['node_modules/@vitejs/plugin-react']?.version !== '6.1.0') throw new Error('React plugin 6.1.0 was not resolved')
          if (p.packages['node_modules/esbuild']) throw new Error('legacy esbuild dependency remains')
          NODE
          mkdir -p ../../frontend-lockfile/Frontend/Chatify
          cp package.json package-lock.json ../../frontend-lockfile/Frontend/Chatify/
          cp ../../frontend-audit.json ../../frontend-lockfile/
          cat ../../frontend-audit.json
      - name: Upload audited frontend lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatify-frontend-vite8-lockfile
          path: frontend-lockfile/
          if-no-files-found: error
          retention-days: 1
