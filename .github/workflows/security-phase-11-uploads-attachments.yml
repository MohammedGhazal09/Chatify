name: Security Phase 11 Uploads and Attachments

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-11-uploads-attachments:
    name: Upload validation, private delivery, and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Reproduce and validate Phase 11
        run: npm run security:phase11:reproduce

      - name: Regenerate deterministic policy after a failed gate
        if: failure()
        continue-on-error: true
        run: npm run security:phase11:generate

      - name: Upload sanitized Phase 11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-11-uploads-attachments-evidence
          path: |
            .artifacts/security/phase-11/run-evidence.json
            docs/security/audit/phase-11/upload-policy.json
            docs/security/audit/phase-11/upload-policy.md
            docs/security/audit/phase-11/phase-11-uploads-attachments-spec.md
            docs/security/audit/phase-11/README.md
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
