name: Materialize clean remediation

on:
  push:
    branches:
      - security/remediation-builder-active6-20260826
    paths:
      - .audit/run-clean-remediation-20260826.txt

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: clean-remediation-builder
  cancel-in-progress: false

jobs:
  materialize-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout builder source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/remediation-builder-active6-20260826
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Materialize reviewed source remediations
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            .audit/remediate-security-remaining-20260825.mjs \
            .audit/remediate-security-compatibility-20260826.mjs \
            .audit/remediate-security-atomic-core-20260826.mjs \
            .audit/remediate-security-atomic-core-fix-20260826.mjs
          do
            test -f "$script"
            node "$script"
          done

      - name: Synchronize immutable dependency locks
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm --prefix Backend/Chatify install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix Backend/Chatify ci
          npm --prefix Frontend/Chatify install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix Frontend/Chatify ci

      - name: Verify backend and security regressions
        working-directory: Backend/Chatify
        run: |
          npm test -- --run
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Verify frontend
        working-directory: Frontend/Chatify
        run: |
          npm test -- --run
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Verify repository policy and operations
        run: |
          npm run ops:check
          npm run security:phase1:doctor
          npm run security:phase1:reproduce
          npm run security:phase2:reproduce
          npm run security:phase3:reproduce
          npm run security:phase4:reproduce
          npm run security:phase5:reproduce
          npm run security:log-assert
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Replace mutable remediation machinery with one immutable gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit
          rm -f \
            .github/workflows/apply-comprehensive-security-remediation-v2.yml \
            .github/workflows/apply-comprehensive-security-remediation.yml \
            .github/workflows/apply-security-dependency-closure.yml \
            .github/workflows/complete-security-remediation-v2.yml \
            .github/workflows/complete-security-remediation.yml \
            .github/workflows/finalize-security-remediation.yml \
            .github/workflows/temporary-canonical-red-green.yml \
            .github/workflows/temporary-canonical-source-export.yml \
            .github/workflows/materialize-clean-remediation-20260826.yml
          cat > .github/workflows/required-quality-gate.yml <<'YAML'
          name: Required Quality Gate

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          concurrency:
            group: required-quality-gate-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            required-quality-gate:
              name: Required quality gate
              runs-on: ubuntu-24.04
              timeout-minutes: 90
              steps:
                - name: Checkout immutable candidate
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    persist-credentials: false
                - name: Setup pinned Node.js
                  uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
                  with:
                    node-version: 24.19.0
                    cache: npm
                    cache-dependency-path: |
                      package-lock.json
                      Backend/Chatify/package-lock.json
                      Frontend/Chatify/package-lock.json
                - name: Pin npm
                  run: npm install --global npm@11.17.0
                - name: Install repository dependencies
                  run: npm ci
                - name: Install backend dependencies
                  working-directory: Backend/Chatify
                  run: npm ci
                - name: Install frontend dependencies
                  working-directory: Frontend/Chatify
                  run: npm ci
                - name: Backend tests and audits
                  working-directory: Backend/Chatify
                  run: |
                    npm test -- --run
                    npm audit --audit-level=high
                    npm audit --omit=dev --audit-level=high
                - name: Frontend tests, lint, build, and audits
                  working-directory: Frontend/Chatify
                  run: |
                    npm test -- --run
                    npm run lint
                    npm run build
                    npm audit --audit-level=high
                    npm audit --omit=dev --audit-level=high
                - name: Repository policy and operations gates
                  run: |
                    npm run ops:check
                    npm run security:phase1:doctor
                    npm run security:phase1:reproduce
                    npm run security:phase2:reproduce
                    npm run security:phase3:reproduce
                    npm run security:phase4:reproduce
                    npm run security:phase5:reproduce
                    npm run security:log-assert
                    npm audit --audit-level=high
                    npm audit --omit=dev --audit-level=high
          YAML

      - name: Publish one ordinary commit directly on main history
        env:
          FINAL_BRANCH: security/complete-remediation-20260826
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          tree_sha="$(git write-tree)"
          parent_sha="$(git rev-parse origin/main)"
          commit_sha="$(printf '%s\n' 'fix(security): resolve validated repository findings' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git push origin "+$commit_sha:refs/heads/$FINAL_BRANCH"
          echo "FINAL_COMMIT=$commit_sha" >> "$GITHUB_ENV"

      - name: Open clean replacement pull request and close obsolete draft
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_BRANCH: security/complete-remediation-20260826
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$FINAL_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$FINAL_BRANCH" \
              --base main \
              --title 'security: resolve validated repository findings' \
              --body $'Replaces #21 with one ordinary commit based directly on main.\n\nThe candidate removes all audit payloads and branch-writing workflows, implements the validated authorization, authentication, realtime, upload, privacy, browser, deployment, and governance fixes, and was published only after backend, frontend, dependency, security-phase, and operations verification passed on the builder.'
          fi
          gh pr close 21 --comment 'Superseded by the clean, immutable remediation branch and replacement pull request.' || true

      - name: Apply exact main protection when the administrator token is configured
        env:
          GH_TOKEN: ${{ secrets.CHATIFY_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'CHATIFY_ADMIN_TOKEN is not configured; repository protection must be applied by an administrator.'
            exit 0
          fi
          cat > /tmp/main-protection.json <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["Required quality gate"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismissal_restrictions": {},
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1,
              "require_last_push_approval": true,
              "bypass_pull_request_allowances": {}
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": true
          }
          JSON
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/branches/main/protection" \
            --input /tmp/main-protection.json

      - name: Remove temporary builder branches
        shell: bash
        run: |
          set +e
          for branch in \
            security/materialize-clean-remediation-20260826 \
            security/remediation-builder-20260826 \
            security/remediation-builder-20260826-v2 \
            security/remediation-builder-20260826-v3 \
            security/remediation-builder-20260826-v4 \
            security/remediation-builder-final-20260826 \
            security/remediation-builder-final2-20260826 \
            security/remediation-builder-final3-20260826 \
            security/remediation-builder-publish-20260826 \
            security/remediation-builder-publish2-20260826 \
            security/remediation-builder-publish3-20260826 \
            security/remediation-builder-publish4-20260826 \
            security/remediation-builder-publish5-20260826 \
            security/remediation-builder-active-20260826 \
            security/remediation-builder-active2-20260826 \
            security/remediation-builder-active3-20260826 \
            security/remediation-builder-active4-20260826 \
            security/remediation-builder-active5-20260826 \
            security/remediation-builder-active6-20260826
          do
            if [ "$branch" != "$GITHUB_REF_NAME" ]; then
              git push origin --delete "$branch"
            fi
          done
          git push origin --delete "$GITHUB_REF_NAME"
          exit 0
