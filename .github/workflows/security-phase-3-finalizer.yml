name: Temporary Phase 3 review evidence finalizer

on:
  push:
    branches:
      - security/phase-3-secret-exposure
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-review-evidence-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-3-secret-exposure
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all available repository refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Verify review fix and generate permanent-tree evidence
        run: |
          git rm --cached -- \
            .github/workflows/security-phase-3-materialize.yml \
            .github/workflows/security-phase-3-finalizer.yml

          node --check Backend/Chatify/Utils/secretConfiguration.mjs
          node --test Backend/Chatify/test/security/secret-configuration.test.mjs
          npm run security:phase3:test
          npm run security:phase3:generate
          git add \
            docs/security/audit/phase-3/secret-scan.json \
            docs/security/audit/phase-3/secret-scan.md
          npm run security:phase1:generate
          npm run security:phase1:check
          npm run security:phase2:generate
          npm run security:phase2:check
          npm run security:phase3:check

          git restore --staged -- \
            .github/workflows/security-phase-3-materialize.yml \
            .github/workflows/security-phase-3-finalizer.yml

      - name: Commit regenerated evidence
        run: |
          git add \
            docs/security/audit/phase-1/inventory.json \
            docs/security/audit/phase-1/inventory.md \
            docs/security/audit/phase-2/threat-model.json \
            docs/security/audit/phase-2/threat-model.md \
            docs/security/audit/phase-3/secret-scan.json \
            docs/security/audit/phase-3/secret-scan.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Generated evidence already represents the permanent Phase 3 tree.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(security): finalize Phase 3 review evidence'
          git fetch origin security/phase-3-secret-exposure
          git rebase origin/security/phase-3-secret-exposure
          git push origin HEAD:security/phase-3-secret-exposure
