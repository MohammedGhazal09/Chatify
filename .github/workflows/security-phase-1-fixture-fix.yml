name: Apply Phase 1 inventory fixture regression fix

on:
  push:
    branches:
      - security/phase-1-repository-inventory

permissions:
  contents: write

jobs:
  patch-and-regenerate:
    name: Patch scanner, test, regenerate, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-1-repository-inventory
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Apply regression fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/security-phase-1-fixture-fix.yml
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')

          const replaceOnce = (source, needle, replacement, label) => {
            const index = source.indexOf(needle)
            if (index < 0) throw new Error(`Missing patch marker: ${label}`)
            if (source.indexOf(needle, index + needle.length) >= 0) {
              throw new Error(`Ambiguous patch marker: ${label}`)
            }
            return `${source.slice(0, index)}${replacement}${source.slice(index + needle.length)}`
          }

          const inventoryPath = 'scripts/security/lib/inventory.mjs'
          let inventory = readFileSync(inventoryPath, 'utf8')
          inventory = replaceOnce(
            inventory,
            "  'docs/',\n]",
            "  'docs/',\n  'scripts/security/__tests__/',\n]",
            'non-runtime Phase 1 test prefix',
          )
          writeFileSync(inventoryPath, inventory)

          const testPath = 'scripts/security/__tests__/phase1-inventory.test.mjs'
          let tests = readFileSync(testPath, 'utf8')
          tests = replaceOnce(
            tests,
            "\n  return root\n}\n\ntest('buildInventory discovers Phase 1 surfaces deterministically and redacts secrets'",
            "\n  await write(root, 'scripts/security/__tests__/fixture.test.mjs', `\nconst fixtureOnly = process.env.PHASE1_FIXTURE_ONLY_SECRET\n`)\n\n  return root\n}\n\ntest('buildInventory discovers Phase 1 surfaces deterministically and redacts secrets'",
            'fixture-only configuration source',
          )
          tests = replaceOnce(
            tests,
            "  assert.ok(first.sensitiveConfiguration.missingFromExamples.includes('WEB_PUSH_PUBLIC_KEY'))\n",
            "  assert.ok(first.sensitiveConfiguration.missingFromExamples.includes('WEB_PUSH_PUBLIC_KEY'))\n  assert.ok(!first.sensitiveConfiguration.variables.some((entry) => entry.name === 'PHASE1_FIXTURE_ONLY_SECRET'))\n",
            'fixture-only configuration assertion',
          )
          writeFileSync(testPath, tests)
          NODE

      - name: Regenerate and verify Phase 1 evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run security:phase1:generate
          npm run security:phase1:test
          npm run security:phase1:check
          npm run doctor
          git diff --check

      - name: Commit corrected scanner and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): exclude audit fixtures from runtime inventory'
          git push origin HEAD:security/phase-1-repository-inventory
