name: Security Phase 1 Inventory

on:
  push:
    branches:
      - security/phase-11-upload-attachments
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-11-inherited-evidence-materialization
  cancel-in-progress: false

jobs:
  materialize-inherited-evidence:
    if: github.repository == 'MohammedGhazal09/Chatify'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Phase 11 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-11-upload-attachments
          fetch-depth: 0
          persist-credentials: true

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Verify exact branch and toolchain
        run: |
          git fetch --force origin \
            '+refs/heads/security/phase-11-upload-attachments:refs/remotes/origin/security/phase-11-upload-attachments' \
            '+refs/heads/security/phase-10-mongodb-data-integrity:refs/remotes/origin/security/phase-10-mongodb-data-integrity'
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/security/phase-11-upload-attachments)"
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Restore inherited read-only workflows
        run: |
          git checkout refs/remotes/origin/security/phase-10-mongodb-data-integrity -- \
            .github/workflows/security-phase-1-inventory.yml \
            .github/workflows/security-phase-2-threat-model.yml \
            .github/workflows/security-phase-3-secret-exposure.yml \
            .github/workflows/security-phase-4-supply-chain.yml \
            .github/workflows/security-phase-5-authentication-session.yml

      - name: Regenerate deterministic Phase 1 through Phase 5 evidence
        run: |
          for pass in 1 2; do
            npm run security:phase1:generate
            npm run security:phase2:generate
            npm run security:phase3:generate
            npm run security:phase4:generate
            npm run security:phase5:generate
          done

      - name: Validate regenerated evidence
        run: |
          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check
          npm run security:phase5:check

      - name: Publish inherited evidence refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/security-phase-1-inventory.yml \
            .github/workflows/security-phase-2-threat-model.yml \
            .github/workflows/security-phase-3-secret-exposure.yml \
            .github/workflows/security-phase-4-supply-chain.yml \
            .github/workflows/security-phase-5-authentication-session.yml \
            docs/security/audit/phase-1 \
            docs/security/audit/phase-2 \
            docs/security/audit/phase-3 \
            docs/security/audit/phase-4 \
            docs/security/audit/phase-5
          git diff --cached --check
          git commit -m 'docs(security): refresh inherited evidence for Phase 11'
          git push origin HEAD:security/phase-11-upload-attachments
