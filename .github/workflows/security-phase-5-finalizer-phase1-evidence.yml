name: Temporary Phase 5 Phase 1 evidence finalizer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-phase1-evidence-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-5-authentication-session')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-5-authentication-session
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch authoritative repository and pull-request refs
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git fetch --force origin \
            '+refs/pull/7/head:refs/remotes/pull/7/head'

      - name: Setup exact Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            Backend/Chatify/package-lock.json
            Frontend/Chatify/package-lock.json

      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'

      - name: Exclude deterministic downstream evidence from Phase 1 inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/security/lib/inventory.mjs')
          text = path.read_text()
          old = """const GENERATED_PATHS = new Set([
            `${OUTPUT_DIRECTORY}/inventory.json`,
            `${OUTPUT_DIRECTORY}/inventory.md`,
          ])"""
          new = """const GENERATED_PATHS = new Set([
            `${OUTPUT_DIRECTORY}/inventory.json`,
            `${OUTPUT_DIRECTORY}/inventory.md`,
            'docs/security/audit/phase-2/threat-model.json',
            'docs/security/audit/phase-2/threat-model.md',
            'docs/security/audit/phase-3/secret-scan.json',
            'docs/security/audit/phase-3/secret-scan.md',
            'docs/security/audit/phase-4/dependency-policy.json',
            'docs/security/audit/phase-4/dependency-policy.md',
            'docs/security/audit/phase-5/authentication-policy.json',
            'docs/security/audit/phase-5/authentication-policy.md',
          ])
          export const PHASE1_EXCLUDED_GENERATED_PATHS = [...GENERATED_PATHS].sort()"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Phase 1 generated-path block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          node --check scripts/security/lib/inventory.mjs
          git diff --check

      - name: Verify the Phase 1 regression and all focused security policy suites
        run: |
          npm run security:phase1:test
          npm run security:phase2:test
          npm run security:phase3:test
          npm run security:phase4:test
          npm run security:phase5:test

          node scripts/security/phase3-secret-scan.mjs --json >/tmp/phase3-final.json
          node <<'NODE'
          const report = require('/tmp/phase3-final.json')
          if (report.currentTree.summary.unsuppressed !== 0) {
            throw new Error(`Phase 3 current tree has ${report.currentTree.summary.unsuppressed} unsuppressed findings`)
          }
          if (report.history.summary.unsuppressed !== 0) {
            throw new Error(`Phase 3 history has ${report.history.summary.unsuppressed} unsuppressed findings`)
          }
          NODE

      - name: Remove temporary Phase 1 evidence workflows
        run: |
          git rm -- \
            .github/workflows/security-phase-5-bootstrap-phase1-red.yml \
            .github/workflows/security-phase-5-finalizer-phase1-evidence.yml

      - name: Publish the permanent source tree before evidence generation
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected Phase 1 downstream-evidence source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): stabilize Phase 1 downstream evidence'
          git push origin HEAD:security/phase-5-authentication-session

      - name: Refresh authoritative refs after source publication
        run: |
          git fetch --force origin \
            '+refs/heads/security/phase-5-authentication-session:refs/remotes/origin/security/phase-5-authentication-session'
          git update-ref refs/remotes/pull/7/head HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/security/phase-5-authentication-session)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/pull/7/head)"

      - name: Generate converged Phase 1 through Phase 5 evidence
        run: |
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate
          npm run security:phase5:generate
          npm run security:phase1:generate
          npm run security:phase2:generate
          npm run security:phase3:generate
          npm run security:phase4:generate
          npm run security:phase5:generate

          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check
          npm run security:phase5:check

      - name: Commit final deterministic evidence
        run: |
          git add \
            docs/security/audit/phase-1 \
            docs/security/audit/phase-2 \
            docs/security/audit/phase-3 \
            docs/security/audit/phase-4 \
            docs/security/audit/phase-5
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected final generated-evidence changes were not produced.' >&2
            exit 1
          fi
          git commit -m 'docs(security): generate stable Phase 5 evidence'
          git update-ref refs/remotes/pull/7/head HEAD

      - name: Verify every deterministic gate on the final local commit
        run: |
          npm run security:phase1:check
          npm run security:phase2:check
          npm run security:phase3:check
          npm run security:phase4:check
          npm run security:phase5:check
          npm run security:phase1:test
          npm run security:phase5:test
          git diff --check
          test -z "$(git status --porcelain=v1)"

      - name: Run complete Phase 5 clean reproduction
        run: npm run security:phase5:reproduce

      - name: Publish verified Phase 5 evidence commit
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)"
          git push origin HEAD:security/phase-5-authentication-session
