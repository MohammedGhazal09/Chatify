name: Temporary Phase 5 Phase 1 evidence TDD red proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-phase1-evidence-red
  cancel-in-progress: true

jobs:
  prove-red:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'security/phase-5-authentication-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/phase-5-authentication-session
          fetch-depth: 0

      - name: Setup exact Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Prove the downstream evidence regression fails before implementation
        run: |
          set +e
          npm run security:phase1:test 2>&1 | tee /tmp/phase1-downstream-red.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo 'Phase 1 downstream generated-evidence regression unexpectedly passed before implementation.' >&2
            exit 1
          fi

          grep -E 'PHASE1_EXCLUDED_GENERATED_PATHS|does not provide an export|SyntaxError' \
            /tmp/phase1-downstream-red.log >/dev/null
          echo 'Observed the required failing Phase 1 downstream generated-evidence regression.'

      - name: Upload red proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-5-phase-1-downstream-evidence-red-proof
          path: /tmp/phase1-downstream-red.log
          if-no-files-found: error
          retention-days: 7
